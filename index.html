<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>天堂M 新篇章1.0 詐騙集團專屬王表</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --gold-theme: #ffd700; --purple-theme: #b388ff; --text-color: #e0e0e0; --border-color: #333; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
        h2, h3 { margin: 10px 0; color: #fff; }
        .purple-header { color: var(--purple-theme); border-bottom: 2px solid var(--purple-theme); padding-bottom: 5px; }
        .normal-header { color: #03dac6; border-bottom: 2px solid #03dac6; padding-bottom: 5px; }
        .time-marquee { background: #311b92; color: #ffd700; font-family: monospace; font-size: 1.3rem; font-weight: bold; text-align: center; padding: 8px; border-radius: 6px; margin-bottom: 12px; border: 1px solid var(--purple-theme); box-shadow: 0 0 10px rgba(179, 136, 255, 0.3); }
        
        .id-panel { background: linear-gradient(135deg, #2c1a04, #1a1103); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #ff9800; display: flex; align-items: center; gap: 10px; }
        .input-id { padding: 8px 12px; background: #000; border: 1px solid #ff9800; color: #ffd700; border-radius: 4px; font-weight: bold; font-size: 0.95rem; flex-grow: 1; }
        .active-id-list {
            width: 100%;
            margin-top: 7px;
            padding: 6px 8px;
            border-top: 1px solid #4a3b00;
            color: #aaa;
            font-size: 0.75rem;
            line-height: 1.5;
            box-sizing: border-box;
        }
        .active-id-title {
            color: #ffcf33;
            font-weight: bold;
            margin-right: 6px;
        }
        .active-id-name {
            display: inline-block;
            margin: 2px 5px 2px 0;
            padding: 2px 7px;
            border: 1px solid #6d5430;
            border-radius: 5px;
            color: #eee;
            background: #29251b;
        }
        
        .control-panel { background: #262626; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .maint-zone { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .input-time { padding: 8px 10px; background: #121212; border: 1px solid #555; color: #fff; border-radius: 4px; font-family: monospace; font-size: 0.9rem; width: 140px; text-align: center; }
        .btn-action { background: #03dac6; color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-reset { background: #cf6679; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        
        .btn-zone { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .boss-btn-purple { background: linear-gradient(135deg, #4a148c, #311b92); color: #fff; border: 2px solid var(--purple-theme); padding: 10px 5px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; text-shadow: 1px 1px 2px #000; width: 100%; }
        .boss-btn-normal { background: #2c2c2c; color: #e0e0e0; border: 1px solid #555; padding: 8px 5px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: 100%; }
        
        .fixed-header { color: #ffb300; border-bottom: 2px solid #ffb300; padding-bottom: 5px; }
        .fixed-row { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 9px 12px; border-radius: 6px; border: 1px solid #5a4a22; }
        .fixed-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .fixed-next { font-size: 1.1rem; font-weight: bold; font-family: monospace; min-width: 85px; color: #ffcf33; text-align: left; }
        .fixed-name { font-size: 0.9rem; font-weight: bold; min-width: 115px; }
        .fixed-schedule { font-size: 0.8rem; color: #ccc; line-height: 1.5; }
        .fixed-soon { color: #ff5252; font-weight: bold; }
        .fixed-countdown { font-size: 0.78rem; color: #aaa; font-family: monospace; white-space: nowrap; }
        .voice-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #262626;
            padding: 7px 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #444;
        }
        .voice-label {
            font-size: 0.82rem;
            color: #ddd;
        }
        .voice-toggle {
            min-width: 58px;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid #555;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .voice-toggle.off {
            background: #333;
            color: #aaa;
        }
        .voice-toggle.on {
            background: #1b8f5a;
            color: #fff;
            border-color: #35c77b;
        }
        #voice-status {
            font-size: 0.75rem;
            color: #aaa;
        }
        .voice-volume-label {
            font-size: 0.75rem;
            color: #aaa;
            margin-left: 6px;
        }
        .voice-volume {
            width: 110px;
            accent-color: #35c77b;
            cursor: pointer;
        }
        .voice-volume-value {
            min-width: 38px;
            font-size: 0.72rem;
            color: #ddd;
            font-family: monospace;
        }
        .cross-server-header {
            color: #ffb74d;
            border-bottom: 2px solid #ffb74d;
            padding-bottom: 5px;
        }

        .cross-server-group {
            margin-top: 10px;
            background: transparent;
        }

        .cross-server-group-title {
            background: #242424;
            color: #ffcc80;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px 10px;
            font-weight: bold;
            margin-bottom: 6px;
        }
.cross-row {
            display: grid;
            grid-template-columns: 180px minmax(0, 1fr) 150px;
            align-items: center;
            gap: 14px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: background-color 0.15s ease, border-color 0.15s ease;
            min-width: 0;
        }

        .cross-row:hover {
            background: var(--card-bg);
            border-color: var(--border-color);
            box-shadow: none;
        }

        .cross-time {
            font-family: monospace;
            font-size: 1.05rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 2px;
            min-width: 0;
        }

        .cross-time-main {
            white-space: normal;
            word-break: keep-all;
            line-height: 1.25;
        }

        .cross-next-time {
            display: none;
        }

        .cross-active-time {
            display: inline-block;
            animation: cross-active-time-flash 1s infinite;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 7px rgba(255, 215, 0, 0.9);
        }

        @keyframes cross-active-time-flash {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.35;
                transform: scale(1.08);
            }
        }

        .cross-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 2px;
            min-width: 0;
            overflow: hidden;
        }

        .cross-info strong {
            display: block;
            width: 100%;
            text-align: left;
            white-space: nowrap;
        }

        .cross-info strong,
        .cross-info small {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cross-info span {
            font-size: 0.82rem;
            color: #ddd;
        }

        .cross-info small {
            color: #ffcc80;
            font-size: 0.72rem;
        }

        .cross-countdown {
            text-align: right;
            font-family: monospace;
            font-size: 0.82rem;
            color: #aaa;
            white-space: nowrap;
        }

        

        .boss-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .boss-row { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); }
        /* 滑鼠移入整列高亮，方便辨認這一列對應的清空按鈕 */
        .boss-row {
            transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .boss-row:hover {
            background: #292929;
            border-color: #777;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .boss-row:hover .boss-time {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.25);
        }

        .boss-info { display: flex; align-items: center; gap: 10px; }
        .boss-time { font-size: 1.1rem; font-weight: bold; font-family: monospace; min-width: 85px; color: #fff; text-align: left; }
        .boss-name { font-size: 0.9rem; }
        
        .boss-actions { display: flex; gap: 5px; }
        .btn-del { padding: 5px 8px; font-size: 0.8rem; background: #5c2514; border: 1px solid #e64a19; color: #ffab91; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .user-tag { font-size: 0.7rem; padding: 1px 5px; border-radius: 3px; background: #333; color: #ffb74d; border: 1px solid #ff9800; margin-left: 6px; font-family: monospace; font-weight: bold; }
        
        .status-tag { font-size: 0.7rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-right: 4px; }
        .tag-purple { background: rgba(179, 136, 255, 0.15); color: var(--purple-theme); border: 1px solid var(--purple-theme); }
        .tag-normal { background: rgba(3, 218, 198, 0.15); color: #03dac6; border: 1px solid #03dac6; }
        
        .note-tag { font-size: 0.7rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-left: 4px; }
        .note-manual { background: rgba(255, 193, 7, 0.15); color: #ffd54f; border: 1px solid #ffb300; }
        .note-enemy { background: #520000; color: #ff8888; border: 1px solid #ff4444; }
        .note-broadcast { background: #002b52; color: #88ccff; border: 1px solid #3399ff; }
        .note-maint { background: #1b5e20; color: #a5d6a7; border: 1px solid #4caf50; }
        .note-autoskip { background: #4a0007; color: #ff8a80; border: 1px solid #ff5252; font-weight: bold; padding: 2px 5px; }


        /* ============================================================
           📱 手機版優化
           不改資料、不改同步、不改 Boss 邏輯，只改善排版。
           ============================================================ */
        @media (max-width: 600px) {

            body {
                padding: 8px;
                overflow-x: hidden;
            }

            h2 {
                font-size: 1.05rem;
                margin: 6px 0 8px;
            }

            h3 {
                font-size: 0.95rem;
            }

            .time-marquee {
                font-size: 0.95rem;
                padding: 7px 5px;
                margin-bottom: 8px;
            }

            .id-panel {
                padding: 9px;
                gap: 7px;
                margin-bottom: 8px;
            }

            .id-panel > span {
                font-size: 0.78rem !important;
                white-space: nowrap;
            }

            .input-id {
                min-width: 0;
                padding: 7px 9px;
                font-size: 0.85rem;
            }

            .control-panel {
                padding: 9px;
                gap: 8px;
                margin-bottom: 10px;
            }

            .maint-zone {
                width: 100%;
                gap: 6px;
            }

            .maint-zone > span {
                width: 100%;
                font-size: 0.78rem !important;
            }

            .input-time {
                flex: 1;
                min-width: 0;
                width: auto;
                font-size: 0.82rem;
                padding: 7px 6px;
            }

            .btn-action {
                flex: 1;
                min-width: 0;
                padding: 7px 5px;
                font-size: 0.75rem;
                white-space: nowrap;
            }

            .btn-reset {
                width: 100%;
                padding: 7px 8px;
                font-size: 0.78rem;
            }

            .btn-zone {
                padding: 9px;
                margin-bottom: 14px;
            }

            .btn-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 5px;
                margin-bottom: 9px;
            }

            .boss-btn-purple,
            .boss-btn-normal {
                min-width: 0;
                padding: 8px 3px;
                font-size: 0.72rem;
                white-space: normal;
                line-height: 1.2;
            }

            /* ★ 王卡片：時間 / 資訊 / 刪除按鈕不再互相擠壓 */
            .boss-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: center;
                gap: 6px;
                padding: 9px 8px;
            }

            .boss-info {
                display: grid;
                grid-template-columns: 82px minmax(0, 1fr);
                align-items: center;
                gap: 6px;
                min-width: 0;
            }

            .boss-time {
                min-width: 0;
                font-size: 0.98rem;
                line-height: 1.15;
                white-space: nowrap;
            }

            .boss-name {
                min-width: 0;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 3px;
                line-height: 1.35;
                overflow-wrap: anywhere;
            }

            .boss-name strong {
                font-size: 0.88rem;
                max-width: 100%;
            }

            .status-tag,
            .note-tag {
                font-size: 0.63rem;
                padding: 1px 3px;
                margin: 0;
                white-space: nowrap;
            }

            .user-tag {
                font-size: 0.62rem;
                margin: 0;
                padding: 1px 4px;
                white-space: nowrap;
            }

            .boss-actions {
                flex-shrink: 0;
                gap: 0;
            }

            .btn-del {
                width: 38px;
                height: 38px;
                padding: 0;
                font-size: 0.95rem;
            }

            .boss-list {
                gap: 6px;
                margin-bottom: 15px;
            }

            /* ★ 固定王手機版 */
            .fixed-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 4px;
                padding: 8px 9px;
            }

            .fixed-info {
                display: grid;
                grid-template-columns: 70px minmax(0, 1fr);
                gap: 5px;
                align-items: center;
            }

            .fixed-next {
                min-width: 0;
                font-size: 0.92rem;
            }

            .fixed-name {
                min-width: 0;
                font-size: 0.86rem;
            }

            .fixed-schedule {
                grid-column: 2;
                font-size: 0.7rem;
                overflow-wrap: anywhere;
            }

            .fixed-countdown {
                text-align: right;
                font-size: 0.72rem;
            }

            .voice-panel {
                padding: 6px 8px;
                gap: 6px;
                margin-bottom: 8px;
            }
            .voice-label { font-size: 0.74rem; }
            .voice-toggle {
                min-width: 52px;
                padding: 5px 8px;
                font-size: 0.7rem;
            }
            #voice-status { font-size: 0.68rem; }

            .cross-server-header {
                padding-bottom: 4px;
            }

            .cross-server-group {
                margin-top: 9px;
            }

            .cross-server-group-title {
                padding: 7px 8px;
                font-size: 0.78rem;
            }

            .cross-row {
                grid-template-columns: 112px minmax(0, 1fr);
                gap: 8px;
                padding: 8px 9px;
            }

            .cross-time {
                font-size: 0.82rem;
                min-width: 0;
                align-self: start;
            }

            .cross-time-main {
                white-space: normal;
                word-break: keep-all;
                line-height: 1.25;
            }

            .cross-next-time {
                display: none;
            }

            .cross-active-time {
                transform-origin: left center;
            }

            .cross-info span {
                font-size: 0.76rem;
            }

            .cross-info small {
                font-size: 0.66rem;
            }

            .cross-countdown {
                grid-column: 2;
                text-align: left;
                font-size: 0.7rem;
                white-space: nowrap;
            }

            .fixed-header,
            .purple-header,
            .normal-header {
                padding-bottom: 4px;
            }
        }

        @keyframes flash-warning { 0% { color: #ffd700; opacity: 1; } 50% { color: #ff5722; opacity: 0.4; } 100% { color: #ffd700; opacity: 1; } }
        .time-flash {
            animation: flash-warning 1s infinite !important;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(255,87,34,0.9);
        }

        /* 出王前 1 分鐘：讓時間本身明顯閃爍 */
        @keyframes flash-warning {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.35;
                transform: scale(1.04);
            }
        }
        .boss-time .seconds {
            font-size: 0.68em;
            opacity: 0.85;
        }

    
        /* 🔐 血盟專屬驗證：未驗證前隱藏王表 */
        #alliance-lock {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 8, 12, 0.97);
            padding: 20px;
            box-sizing: border-box;
        }
        .lock-card {
            width: min(420px, 100%);
            background: #1e1e1e;
            border: 1px solid #b388ff;
            border-radius: 14px;
            padding: 28px 22px;
            box-shadow: 0 0 30px rgba(179, 136, 255, 0.25);
            text-align: center;
        }
        .lock-title {
            color: #ffd700;
            font-size: 1.45rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .lock-subtitle {
            color: #bbb;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }
        #alliance-code {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #101010;
            color: #fff;
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 0.25em;
            outline: none;
        }
        #alliance-code:focus { border-color: #b388ff; }
        #alliance-unlock {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            border: 0;
            border-radius: 8px;
            background: #b388ff;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }
        #alliance-error {
            min-height: 20px;
            margin-top: 10px;
            color: #ff667d;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .cross-event-flash .cross-time-main,
        .cross-event-flash .cross-time {
            animation: crossEventFlash 0.8s steps(2, start) infinite;
        }

        @keyframes crossEventFlash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
</style>
</head>
<body>
    <div id="alliance-lock">
        <div class="lock-card">
            <div class="lock-title">🔐 詐騙集團 專屬王表</div>
            <div class="lock-subtitle">請輸入血盟專屬驗證碼後使用</div>
            <input id="alliance-code" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="輸入 6 位驗證碼">
            <button id="alliance-unlock" type="button" onclick="unlockAlliance()">進入王表</button>
            <div id="alliance-error"></div>
        </div>
    </div>

    <h2>🕒 天堂M 新篇章1.0 詐騙集團專屬王表</h2>
    <div class="voice-panel">
        <span class="voice-label">🔊 語音提醒</span>
        <button id="voice-toggle-btn" class="voice-toggle off" onclick="toggleVoiceAlerts()">OFF</button>
        <span id="voice-status">關閉</span>
        <span class="voice-volume-label">音量</span>
        <input id="voice-volume" class="voice-volume" type="range" min="0" max="100" step="5" value="100" oninput="setVoiceVolume(this.value)">
        <span id="voice-volume-value" class="voice-volume-value">100%</span>
    </div>
    <div id="standard-clock" class="time-marquee">🇹🇼 中原標準時間 ➔ ⏳ 系統校時中...</div>

    <div class="id-panel">
        <span style="color: #ff9800; font-weight: bold; font-size: 0.9rem;">🔑 填單人員 ID：</span>
        <input type="text" id="user-id-input" class="input-id" placeholder="請先輸入您的遊戲內ID（必填）" oninput="saveLocalID()">
        <div id="active-id-list" class="active-id-list">
            <span class="active-id-title">👥 使用中的成員：</span>
            <span id="active-id-names">目前尚無雲端紀錄</span>
        </div>
    </div>

    <div class="control-panel">
        <div class="maint-zone">
            <span style="color: #03dac6; font-weight: bold; font-size: 0.85rem;">🗓️ 維修結束時間輸入：</span>
            <input type="text" id="maint-start-input" class="input-time" placeholder="例如08201030 (8/20 10:30)">
            <button class="btn-action" onclick="setMaintenanceTime()">📢 開機時間確認</button>
        </div>
        <button class="btn-reset" onclick="resetToMaintenance()">王表時間全部重置</button>
    </div>
    
    <div class="btn-zone">
        <h3 style="color: var(--purple-theme); margin-top:0; font-size:0.9rem;">🌟 點擊按鈕回報戰況：【全盟友手機 0.5 秒即時大同步，無須重新整理】</h3>

        function checkCrossServerAlerts() {
            var now = new Date();

            var taiwanParts = new Intl.DateTimeFormat(
                'zh-TW',
                {
                    timeZone: 'Asia/Taipei',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }
            ).formatToParts(now);

            function getPart(type) {
                var p = taiwanParts.find(function(x) {
                    return x.type === type;
                });

                return p
                    ? parseInt(p.value, 10)
                    : 0;
            }

            var h = getPart('hour');
            var m = getPart('minute');
            var sec = getPart('second');

            var totalSec =
                h * 3600 +
                m * 60 +
                sec;

            var twWeekday =
                new Intl.DateTimeFormat(
                    'en-US',
                    {
                        timeZone: 'Asia/Taipei',
                        weekday: 'short'
                    }
                ).format(now);

            var dayMap = {
                Sun: 0,
                Mon: 1,
                Tue: 2,
                Wed: 3,
                Thu: 4,
                Fri: 5,
                Sat: 6
            };

            var currentDay =
                dayMap[twWeekday];

            var groups = [
                {
                    items:
                        crossServerBossConfig.weekday,
                    day: null
                },
                {
                    items:
                        crossServerBossConfig.weekend.filter(
                            function(item) {
                                return (
                                    String(
                                        item.area || ''
                                    ).trim() ===
                                    '遺忘之島'
                                );
                            }
                        ),
                    day: 6
                },
                {
                    items:
                        crossServerBossConfig.weekend.filter(
                            function(item) {
                                var area =
                                    String(
                                        item.area || ''
                                    ).trim();

                                var boss =
                                    String(
                                        item.boss || ''
                                    ).trim();

                                    area ===
                                        '拉斯塔巴德' ||

                                        '暗殺君王' ||
                                    boss ===
                                        '法令君王' ||
                                    boss ===
                                        '魔獸君王' ||
                                    boss ===
                                        '冥法君王'
                                );
                            }
                        ),
                    day: 0
                }
            ];

            groups.forEach(function(group) {
                // 假日王只在實際對應的星期通知。

                    group.day !== null &&

                                    parts[1],
                                    10
                                );

                                isNaN(th) ||
                                isNaN(tm)
                            ) {
                                return;
                            }

                            var eventSec =
                                th * 3600 +
                                tm * 60;

                            // 「時間到」的同一分鐘內觸發一次。
                            // 不再要求剛好卡在某一秒，避免瀏覽器
                            // 背景分頁／省電模式造成通知漏掉。
                            var currentMinute =
                                h * 60 + m;

                            var eventMinute =
                                th * 60 + tm;

                            if (
                                currentMinute !==
                                eventMinute
                            ) {

                            }

        function renderCrossServerBosses() {
            var container = document.getElementById('cross-server-container');
            if (!container) return;

            container.innerHTML = '';

            var now = new Date();
            var nowMs = now.getTime();

            // 王表固定以台灣時間判斷星期，避免使用者手機／電腦時區
            // 不是 Asia/Taipei 時造成星期日拉斯塔巴德消失。
            var taiwanParts = new Intl.DateTimeFormat(
                'zh-TW',
                {
                    timeZone: 'Asia/Taipei',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false,
                    weekday: 'short'
                }
            ).formatToParts(now);

            var taiwanWeekday = taiwanParts.find(function(p) {
                return p.type === 'weekday';
            }).value;

            var dayMap = {
                '週日': 0,
                '週一': 1,
                '週二': 2,
                '週三': 3,
                '週四': 4,
                '週五': 5,
                '週六': 6,
                '星期日': 0,
                '星期一': 1,
                '星期二': 2,
                '星期三': 3,
                '星期四': 4,
                '星期五': 5,
                '星期六': 6
            };

            var day = dayMap[taiwanWeekday];
            var isWeekend = (day === 0 || day === 6);
            var source = isWeekend
                ? crossServerBossConfig.weekend
                : crossServerBossConfig.weekday;

            function nextOccurrence(timeText, targetWeekend, targetDay) {
                var parts = timeText.split(':');
                var candidate = new Date(now);

                candidate.setHours(
                    parseInt(parts[0], 10),
                    parseInt(parts[1], 10),
                    0,
                    0
                );

                if (!targetWeekend) {
                    // 平日：下一個週一～週五
                    if (candidate.getTime() <= nowMs) {
                        candidate.setDate(candidate.getDate() + 1);
                    }

                    while (
                        candidate.getDay() === 0 ||
                        candidate.getDay() === 6
                    ) {
                        candidate.setDate(candidate.getDate() + 1);
                    }

                    return candidate;
                }

                // 假日固定指定星期：
                // 遺忘之島 = 星期六；拉斯塔巴德 = 星期日。
                while (candidate.getDay() !== targetDay) {
                    candidate.setDate(candidate.getDate() + 1);
                }

                if (candidate.getTime() <= nowMs) {
                    candidate.setDate(candidate.getDate() + 7);
                }

                return candidate;
            }

            function countdownText(ms) {
                if (ms <= 0) return '即將開始';

                var total = Math.floor(ms / 1000);
                var h = Math.floor(total / 3600);
                var m = Math.floor((total % 3600) / 60);
                var s = total % 60;

                return '還有 ' +
                    (h < 10 ? '0' : '') + h + ':' +
                    (m < 10 ? '0' : '') + m + ':' +
                    (s < 10 ? '0' : '') + s;
            }

            function renderGroup(title, items, scheduleWeekend, targetDay) {
                if (!items.length) return '';

                var isLastabard =
                    title.indexOf('拉斯塔巴德') !== -1;

                var rows = [];

                if (isLastabard) {
                    // 拉斯塔巴德：相同名稱的王合併成同一列，
                    // 例如：
                    // 暗殺君王  16:00、16:10、16:20
                    // 法令君王  16:00、16:10、16:20
                    var grouped = {};

                    items.forEach(function(item) {
                        var key = item.boss || item.area;

                        if (!grouped[key]) {
                            grouped[key] = {
                                area: item.area,
                                boss: item.boss,
                                times: [],
                                type: item.type,
                                note: item.note
                            };
                        }

                        item.time.split('、').forEach(function(t) {
                            if (
                                grouped[key].times.indexOf(t) === -1
                            ) {
                                grouped[key].times.push(t);
                            }
                        });
                    });

                    Object.keys(grouped).forEach(function(key) {
                        var item = grouped[key];

                        item.times.sort(function(a, b) {
                            return a.localeCompare(b);
                        });

                        var occurrences = item.times.map(function(t) {
                            return {
                                time: t,
                                date: nextOccurrence(t, scheduleWeekend, targetDay)
                            };
                        });

                        occurrences.sort(function(a, b) {
                            return a.date.getTime() - b.date.getTime();
                        });

                        var next = occurrences[0];

                        rows.push({
                            area: item.area,
                            boss: item.boss,
                            times: item.times,
                            time: item.times.join('、'),
                            nextTime: next.time,
                            type: item.type,
                            note: item.note,
                            date: next.date,
                            countdown: next.date.getTime() - nowMs
                        });
                    });

                } else {
                    // 遺忘之島／其他區域維持原本一個時間一列。
                    items.forEach(function(item) {
                        var times = item.time.split('、');

                        times.forEach(function(t) {
                            var date = nextOccurrence(t, scheduleWeekend, targetDay);

                            rows.push({
                                area: item.area,
                                boss: item.boss,
                                times: [t],
                                time: t,
                                nextTime: t,
                                type: item.type,
                                note: item.note,
                                date: date,
                                countdown: date.getTime() - nowMs
                            });
                        });
                    });
                }

                rows.sort(function(a, b) {
                    return a.date.getTime() - b.date.getTime();
                });

                var html =
                    '<div class="cross-server-group">' +
                        '<div class="cross-server-group-title">' +
                            title +
                        '</div>';

                rows.forEach(function(item) {
                    var shouldFlash =
                        item.type === '出王' &&

        // ============================================================
        // ☁️【全盟同步區】

        function getFirebaseUrl() {
            return firebaseUrl.replace(/\/+$/, '') +
                   firebasePath +
                   '.json';
        }

        async function pullFromCloud() {
            if (firebaseUrl.indexOf("YOUR-PROJECT") !== -1) return;

            try {
                var response = await fetch(
                    getFirebaseUrl() + '?t=' + Date.now(),
                    { method:'GET', cache:'no-store' }
                );

                if (!response.ok) return;

                var cloudData = await response.json();

                bossSpawnMap =
                    (cloudData && typeof cloudData === 'object')
                    ? cloudData
                    : {};

                localStorage.setItem(
                    localKey,
                    JSON.stringify(bossSpawnMap)
                );

                renderTable();
                updateActiveIDList();

            } catch (error) {
                console.log('Firebase 讀取錯誤：', error);
            }
        }

        async function pushToCloud() {
            try {
                localStorage.setItem(
                    localKey,
                    JSON.stringify(bossSpawnMap)
                );

                renderTable();
                updateActiveIDList();

                if (firebaseUrl.indexOf("YOUR-PROJECT") !== -1) return;

                var response = await fetch(
                    getFirebaseUrl(),
                    {
                        method:'PUT',
                        headers:{'Content-Type':'application/json'},
                        body:JSON.stringify(bossSpawnMap)
                    }
                );

                if (!response.ok) {
                    console.log(
                        'Firebase 上傳失敗：HTTP ' +
                        response.status
                    );
                }

            } catch (error) {
                console.log('Firebase 上傳錯誤：', error);
            }
        }

        // Firebase Realtime Database SSE。
        // 任一台手機 / 電腦更新後，其他開啟網站的裝置自動收到。
        function startRealtimeSync() {
            if (firebaseUrl.indexOf("YOUR-PROJECT") !== -1) return;

            try {
                if (realtimeSource) {
                    realtimeSource.close();
                }

                realtimeSource =
                    new EventSource(getFirebaseUrl());

                realtimeSource.addEventListener(
                    'put',
                    function(event) {
                        try {
                            var payload =
                                JSON.parse(event.data);

                            if (!payload) return;

                            if (
                                payload.path === '/' ||
                                payload.path === ''
                            ) {
                                bossSpawnMap =
                                    payload.data || {};
                            } else {
                                var path =
                                    String(payload.path)
                                        .split('/')
                                        .filter(Boolean);

                                if (path.length === 1) {
                                    var bossName = path[0];

                                    if (
                                        payload.data === null
                                    ) {
                                        delete bossSpawnMap[bossName];
                                    } else {
                                        bossSpawnMap[bossName] =
                                            payload.data;
                                    }
                                }
                            }

                            localStorage.setItem(
                                localKey,
                                JSON.stringify(bossSpawnMap)
                            );

                            renderTable();

                        } catch (error) {
                            console.log(
                                'Firebase PUT 解析錯誤：',
                                error
                            );
                        }
                    }
                );

                realtimeSource.addEventListener(
                    'patch',
                    function(event) {
                        try {
                            var payload =
                                JSON.parse(event.data);

                            if (
                                !payload ||
                                !payload.data
                            ) return;

                            var patchData = payload.data;

                            for (var key in patchData) {
                                if (
                                    !Object.prototype
                                        .hasOwnProperty
                                        .call(patchData, key)
                                ) continue;

                                if (patchData[key] === null) {
                                    delete bossSpawnMap[key];
                                } else {
                                    bossSpawnMap[key] =
                                        patchData[key];
                                }
                            }

                            localStorage.setItem(
                                localKey,
                                JSON.stringify(bossSpawnMap)
                            );

                            renderTable();

                        } catch (error) {
                            console.log(
                                'Firebase PATCH 解析錯誤：',
                                error
                            );
                        }
                    }
                );

                realtimeSource.onerror = function() {
                    pullFromCloud();
                };

                console.log(
                    '✅ Firebase 全盟即時同步已啟動'
                );

            } catch (error) {
                console.log(
                    'Firebase 即時同步啟動失敗：',
                    error
                );
            }
        }

        function setMaintenanceTime() {
            var myID = getValidID(); if(!myID) return;
            var inputEl = document.getElementById('maint-start-input'); var val = inputEl.value.trim().replace(/[:\/ ]/g, '');
            if (!/^\d{8}$/.test(val)) { alert('請輸入精確的 8 位數開機月日時間！\n例如：08201030 (8月20日 10:30)'); return; }
            
            var currentYear = new Date().getFullYear();
            var m = parseInt(val.substring(0, 2), 10) - 1; var d = parseInt(val.substring(2, 4), 10);
            var h = parseInt(val.substring(4, 6), 10); var min = parseInt(val.substring(6, 8), 10);
            
            var maintDate = new Date(currentYear, m, d, h, min, 0);
            if (isNaN(maintDate.getTime())) { alert('時間格式錯誤！'); return; }
            
            var now = new Date(); if (maintDate > now) { alert('設定時間不能比現在晚！'); return; }
            if (!confirm('確認要以開機時間起算並同步全盟嗎？')) return;
            
            var nowMs = now.getTime();
            bossSpawnMap = {}; 
            
            for (var i = 0; i < bossConfig.length; i++) {
                var config = bossConfig[i];
                var cdMs = config.cooldown * 60 * 1000;
                var firstSpawnMs = maintDate.getTime() + cdMs;
                
                var finalTimestamp = firstSpawnMs;
                var passedRounds = 0;
                
                if (nowMs >= firstSpawnMs) {
                    var elapsedMs = nowMs - firstSpawnMs;
                    passedRounds = Math.floor(elapsedMs / cdMs) + 1;
                    finalTimestamp = firstSpawnMs + (passedRounds * cdMs);
                }
                
                bossSpawnMap[config.name] = finalTimestamp + "|" + myID + "|開機時間|" + passedRounds;
            }
            pushToCloud(); inputEl.value = ''; alert('⚙️ 獨立新企業級雲端通道佈署成功！');
        }

        function quickReportKill(bossName) {
            var myID = getValidID(); if(!myID) return;
            var now = new Date();
            var curTimeString = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes() + ':' + (now.getSeconds() < 10 ? '0' : '') + now.getSeconds();
            
            var userInput = prompt('確認【' + bossName + '】死亡時間：', curTimeString); 
            if (userInput === null) return;
            
            var cleanInput = userInput.replace(/:/g, '').trim(); 
            if (cleanInput === '') {
                bossSpawnMap[bossName] = "SKIP|" + myID + "||0";
                pushToCloud(); return;
            }
            
            var killH, killM, killS = 0;
            if (cleanInput.length === 4) { killH = parseInt(cleanInput.substring(0, 2), 10); killM = parseInt(cleanInput.substring(2, 4), 10); }
            else if (cleanInput.length === 6) { killH = parseInt(cleanInput.substring(0, 2), 10); killM = parseInt(cleanInput.substring(2, 4), 10); killS = parseInt(cleanInput.substring(4, 6), 10); }
            else { alert('格式錯誤！'); return; }
            
            var noteInput = prompt(
                '請選擇狀態／輸入手動備註原因：\n' +
                '輸入 1 ➔ 敵吃\n' +
                '輸入 2 ➔ 廣播\n' +
                '輸入 3 ➔ 開機時間\n' +
                '直接輸入文字 ➔ 使用你輸入的原因\n' +
                '直接確定(留白) ➔ 正常計算',
                ''
            );

            if (noteInput === null) return;

            noteInput = noteInput.trim();

            var bossNote = "";

            if (noteInput === "1") {
                bossNote = "敵吃";
            } else if (noteInput === "2") {
                bossNote = "廣播";
            } else if (noteInput === "3") {
                bossNote = "開機時間";
            } else if (noteInput !== "") {
                // 使用者直接輸入文字，就把文字當成手動備註原因。
                bossNote = noteInput
                    .replace(/\|/g, '／')
                    .replace(/</g, '＜')
                    .replace(/>/g, '＞');
            }

            var targetDate = new Date(); targetDate.setHours(killH, killM, killS, 0);
            var nextSpawn = targetDate.getTime() + (getCooldown(bossName) * 60 * 1000);
            
            bossSpawnMap[bossName] =
                nextSpawn + "|" +
                myID + "|" +
                bossNote + "|0";
            pushToCloud();
        }
