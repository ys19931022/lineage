        function renderFixedBosses() {
            var container = document.getElementById('fixed-boss-container');
            if (!container) return;

            container.innerHTML = '';

            var now = new Date();
            var nowMs = now.getTime();
            var fixedRows = [];

            function getNextOccurrence(timeText, noSpawnDays) {
                var startText = timeText.split('-')[0];
                var parts = startText.split(':');

                var candidate = new Date(now);
                candidate.setHours(
                    parseInt(parts[0], 10),
                    parseInt(parts[1], 10),
                    0,
                    0
                );

                // 找到下一個「允許出王」的日期。
                // noSpawnDays：0=週日、6=週六。
                for (var i = 0; i < 8; i++) {
                    var day = candidate.getDay();

                    if (
                        !noSpawnDays ||
                        noSpawnDays.indexOf(day) === -1
                    ) {
                        if (candidate.getTime() > nowMs) {
                            return candidate;
                        }
                    }

                    candidate.setDate(candidate.getDate() + 1);
                    candidate.setHours(
                        parseInt(parts[0], 10),
                        parseInt(parts[1], 10),
                        0,
                        0
                    );
                }

                return candidate;
            }

            function formatCountdown(ms) {
                if (ms <= 0) return '即將開始';

                var totalSeconds = Math.floor(ms / 1000);
                var hours = Math.floor(totalSeconds / 3600);
                var minutes = Math.floor((totalSeconds % 3600) / 60);
                var seconds = totalSeconds % 60;

                return '還有 ' +
                    (hours < 10 ? '0' : '') + hours + ':' +
                    (minutes < 10 ? '0' : '') + minutes + ':' +
                    (seconds < 10 ? '0' : '') + seconds;
            }

            fixedBossConfig.forEach(function(fixed) {
                var occurrences = fixed.times.map(function(timeText) {
                    return {
                        text: timeText,
                        date: getNextOccurrence(
                            timeText,
                            fixed.noSpawnDays || []
                        )
                    };
                });

                occurrences.sort(function(a, b) {
                    return a.date.getTime() - b.date.getTime();
                });

                var next = occurrences[0];
                var countdown = next.date.getTime() - nowMs;

                fixedRows.push({
                    name: fixed.name,
                    times: fixed.times,
                    noSpawnDays: fixed.noSpawnDays || [],
                    next: next,
                    countdown: countdown
                });
            });

            fixedRows.sort(function(a, b) {
                return a.next.date.getTime() - b.next.date.getTime();
            });

            fixedRows.forEach(function(item) {
                var row = document.createElement('div');
                row.className = 'fixed-row';

                var soon = item.countdown <= 30 * 60 * 1000;
                var cls = soon ? ' fixed-soon' : '';

                var cycleText = item.noSpawnDays.indexOf(0) !== -1 &&
                                item.noSpawnDays.indexOf(6) !== -1
                    ? '平日出王｜假日不出王'
                    : '每日';

                row.innerHTML =
                    '<div class="fixed-info">' +
                        '<div class="fixed-next' + cls + '">' +
                            item.next.text +
                        '</div>' +
                        '<div class="fixed-name">' +
                            '⏰ ' + item.name +
                        '</div>' +
                        '<div class="fixed-schedule">' +
                            cycleText + '：' +
                            item.times.join('　') +
                        '</div>' +
                    '</div>' +
                    '<div class="fixed-countdown' + cls + '">' +
                        formatCountdown(item.countdown) +
                    '</div>';

                container.appendChild(row);
            });
        }


        // ============================================================
        // 🔊 語音提醒（只新增這一區）
        // 每隻王每一輪：
        // ① 出王前 1 分鐘提醒一次
        // ② 出王時間到提醒一次
        // 語音開關只儲存在「本台裝置」，不影響其他盟友。
        // ============================================================
        var voiceAlertsEnabled =
            localStorage.getItem('lineageVoiceAlerts') === '1';

        // Chrome 重新載入頁面後，語音播放需要新的使用者互動。
        // 只要使用者在頁面上點一下，就重新解鎖語音。
        var voiceSpeechUnlocked = false;

        var voiceAlertVolume = parseFloat(
            localStorage.getItem('lineageVoiceVolume') || '1'
        );

        if (
            isNaN(voiceAlertVolume) ||
            voiceAlertVolume < 0 ||
            voiceAlertVolume > 1
        ) {
            voiceAlertVolume = 1;
        }

        function setVoiceVolume(value) {
            var n = parseInt(value, 10);
            if (isNaN(n)) n = 100;

            n = Math.max(0, Math.min(100, n));
            voiceAlertVolume = n / 100;

            localStorage.setItem(
                'lineageVoiceVolume',
                String(voiceAlertVolume)
            );

            var valueEl =
                document.getElementById('voice-volume-value');

            if (valueEl) {
                valueEl.textContent = n + '%';
            }
        }

        function updateVoiceVolumeUI() {
            var slider =
                document.getElementById('voice-volume');

            if (slider) {
                slider.value =
                    Math.round(voiceAlertVolume * 100);
            }

            var valueEl =
                document.getElementById('voice-volume-value');

            if (valueEl) {
                valueEl.textContent =
                    Math.round(voiceAlertVolume * 100) + '%';
            }
        }

        var voiceAlertState = {};

        function updateVoiceToggleUI() {
            var btn = document.getElementById('voice-toggle-btn');
            var status = document.getElementById('voice-status');

            if (!btn || !status) return;

            if (voiceAlertsEnabled) {
                btn.textContent = 'ON';
                btn.className = 'voice-toggle on';
                status.textContent = '已開啟（點一下頁面啟用語音）';
            } else {
                btn.textContent = 'OFF';
                btn.className = 'voice-toggle off';
                status.textContent = '關閉';
            }
        }

        function toggleVoiceAlerts() {
            if (voiceAlertsEnabled) {
                // 關閉語音
                voiceAlertsEnabled = false;

                localStorage.setItem(
                    'lineageVoiceAlerts',
                    '0'
                );

                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }

                updateVoiceToggleUI();
                return;
            }

            // 開啟語音：
            // 一定要透過使用者點擊來重新啟動，避免 Chrome 在重新整理
            // 或重新開啟頁面後，因自動播放限制而不出聲。
            if (!window.speechSynthesis) {
                alert('此瀏覽器不支援語音提醒。');
                return;
            }

            voiceAlertsEnabled = true;
            voiceSpeechUnlocked = true;

            localStorage.setItem(
                'lineageVoiceAlerts',
                '1'
            );

            var testUtterance =
                new SpeechSynthesisUtterance('語音提醒已開啟');

            testUtterance.lang = 'zh-TW';
            testUtterance.rate = 1.05;
            testUtterance.pitch = 1;
            testUtterance.volume = voiceAlertVolume;

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(testUtterance);

            updateVoiceToggleUI();
        }

        function speakLineageBossAlert(bossName, type) {
            if (
                !voiceAlertsEnabled ||
                !voiceSpeechUnlocked ||
                !window.speechSynthesis
            ) {
                return false;
            }

            var message =
                type === 'before'
                    ? '注意，' + bossName + ' 一分鐘後出王！'
                    : '注意，' + bossName + ' 出王了！';

            try {
                // Chrome 偶爾會讓 speechSynthesis 卡在 paused 狀態。
                window.speechSynthesis.resume();

                var utterance =
                    new SpeechSynthesisUtterance(message);

                utterance.lang = 'zh-TW';
                utterance.rate = 1.05;
                utterance.pitch = 1;
                utterance.volume = voiceAlertVolume;

                window.speechSynthesis.speak(utterance);

                return true;
            } catch (e) {
                return false;
            }
        }

        function checkLineageBossVoiceAlerts() {
            if (!voiceAlertsEnabled) return;

            var nowMs = Date.now();

            if (
                typeof bossConfig === 'undefined' ||
                typeof bossSpawnMap === 'undefined'
            ) return;

            bossConfig.forEach(function(config) {

                var dataStr =
                    bossSpawnMap[config.name];

                if (
                    !dataStr ||
                    dataStr.indexOf('|') === -1
                ) return;

                var parts =
                    dataStr.split('|');

                var rawTime = parts[0];

                if (
                    rawTime === 'SKIP' ||
                    !rawTime
                ) return;

                var originalTimestamp =
                    parseInt(rawTime, 10);

                if (isNaN(originalTimestamp)) return;

                // ★ 重要修正：
                // renderTable 會在超過 10 分鐘後自動輪空，
                // 但原本語音提醒仍拿「舊的王時間」判斷，
                // 因此輪空第 1、2、3... 輪後就不會再提醒。
                //
                // 這裡完全比照 renderTable 的輪空計算，
                // 找出「真正下一次要出的王時間」。
                var effectiveTimestamp =
                    originalTimestamp;

                var graceMs =
                    10 * 60 * 1000;

                var cooldownMs =
                    config.cooldown *
                    60 *
                    1000;

                if (
                    nowMs >=
                    effectiveTimestamp +
                    graceMs
                ) {
                    var autoSkipRounds =
                        Math.ceil(
                            (
                                nowMs -
                                effectiveTimestamp -
                                graceMs
                            ) /
                            cooldownMs
                        );

                    if (autoSkipRounds < 1) {
                        autoSkipRounds = 1;
                    }

                    effectiveTimestamp =
                        effectiveTimestamp +
                        (
                            autoSkipRounds *
                            cooldownMs
                        );
                }

                var cycleKey =
                    config.name + '_' +
                    effectiveTimestamp;

                // 出王前 1 分鐘
                if (
                    !voiceAlertState[
                        cycleKey + '_before'
                    ]
                ) {
                    var beforeMs =
                        effectiveTimestamp -
                        nowMs;

                    if (
                        beforeMs > 0 &&
                        beforeMs <= 60000
                    ) {
                        if (speakLineageBossAlert(
                            config.displayName ||
                            config.name,
                            'before'
                        )) {
                            voiceAlertState[
                                cycleKey + '_before'
                            ] = true;
                        }
                    }
                }

                // 出王時間到
                if (
                    !voiceAlertState[
                        cycleKey + '_spawn'
                    ]
                ) {
                    var afterMs =
                        nowMs -
                        effectiveTimestamp;

                    if (
                        afterMs >= 0 &&
                        afterMs < 60000
                    ) {
                        if (speakLineageBossAlert(
                            config.displayName ||
                            config.name,
                            'spawn'
                        )) {
                            voiceAlertState[
                                cycleKey + '_spawn'
                            ] = true;
                        }
                    }
                }
            });

            // ========================================================
            // ⏰ 固定王語音提醒
            // 每個固定王的每個固定時段：
            // ① 前 1 分鐘提醒一次
            // ② 時間到提醒一次
            // ========================================================
            if (
                typeof fixedBossConfig !== 'undefined' &&
                Array.isArray(fixedBossConfig)
            ) {
                fixedBossConfig.forEach(function(fixed) {

                    var todayDay =
                        new Date().toLocaleDateString(
                            'en-US',
                            {
                                timeZone: 'Asia/Taipei',
                                weekday: 'short'
                            }
                        );

                    var fixedDayMap = {
                        'Sun': 0,
                        'Mon': 1,
                        'Tue': 2,
                        'Wed': 3,
                        'Thu': 4,
                        'Fri': 5,
                        'Sat': 6
                    };

                    todayDay =
                        fixedDayMap[todayDay];

                    if (
                        Array.isArray(
                            fixed.noSpawnDays
                        ) &&
                        fixed.noSpawnDays.indexOf(
                            todayDay
                        ) !== -1
                    ) {
                        return;
                    }

                    fixed.times.forEach(function(timeText) {

                        var startText =
                            timeText.split('-')[0];

                        var timeParts =
                            startText.split(':');

                        var hour =
                            parseInt(
                                timeParts[0],
                                10
                            );

                        var minute =
                            parseInt(
                                timeParts[1],
                                10
                            );

                        if (
                            isNaN(hour) ||
                            isNaN(minute)
                        ) return;

                        var target =
                            new Date();

                        target.setHours(
                            hour,
                            minute,
                            0,
                            0
                        );

                        var todayTargetMs =
                            target.getTime();

                        if (
                            todayTargetMs <
                            nowMs - 60000
                        ) {
                            target.setDate(
                                target.getDate() + 1
                            );
                        }

                        var targetMs =
                            target.getTime();

                        var cycleKey =
                            'FIXED_' +
                            fixed.name + '_' +
                            timeText + '_' +
                            targetMs;

                        // 前 1 分鐘
                        if (
                            !voiceAlertState[
                                cycleKey + '_before'
                            ]
                        ) {
                            var beforeMs =
                                targetMs - nowMs;

                            if (
                                beforeMs > 0 &&
                                beforeMs <= 60000
                            ) {
                                if (speakLineageBossAlert(
                                    fixed.name,
                                    'before'
                                )) {
                                    voiceAlertState[
                                        cycleKey + '_before'
                                    ] = true;
                                }
                            }
                        }

                        // 時間到
                        if (
                            !voiceAlertState[
                                cycleKey + '_spawn'
                            ]
                        ) {
                            var afterMs =
                                nowMs - targetMs;

                            if (
                                afterMs >= 0 &&
                                afterMs < 60000
                            ) {
                                if (speakLineageBossAlert(
                                    fixed.name,
                                    'spawn'
                                )) {
                                    voiceAlertState[
                                        cycleKey + '_spawn'
                                    ] = true;
                                }
                            }
                        }
                    });
                });
            }
        }

        // 如果使用者之前選擇 ON，Chrome 重新載入後需要新的
        // user gesture；第一次點擊頁面就重新解鎖。
        document.addEventListener('click', function() {
            if (!voiceAlertsEnabled || voiceSpeechUnlocked) return;

            voiceSpeechUnlocked = true;

            if (window.speechSynthesis) {
                window.speechSynthesis.resume();
            }
        }, { once: true });

        // 每秒檢查一次，但只有在語音開關 ON 時才會播放。
        setInterval(
            checkLineageBossVoiceAlerts,
            1000
        );

        // 跨服 BOSS：時間到時提醒一次。
        // 立即檢查一次，之後每秒檢查。
        checkCrossServerAlerts();

        setInterval(
            checkCrossServerAlerts,
            1000
        );

        // 初始化本機語音開關與音量狀態。
        setTimeout(
            function() {
                updateVoiceToggleUI();
                updateVoiceVolumeUI();
            },
            0
        );

        function formatBossTime(timeText) {
            if (!timeText || timeText === '--:--:--') {
                return timeText;
            }

            var match = timeText.match(/^(\d{2}:\d{2})(:\d{2})$/);

            if (!match) {
                return timeText;
            }

            return match[1] +
                '<span class="seconds">' +
                match[2] +
                '</span>';
        }

        function renderTable() {
            var pContain = document.getElementById('purple-boss-container'),
                nContain = document.getElementById('normal-boss-container');

            if (!pContain || !nContain) return;

            pContain.innerHTML = '';
            nContain.innerHTML = '';

            var nowMs = new Date().getTime();
            var purpleRows = [];
            var normalRows = [];

            // ------------------------------------------------------------
            // 依照「真正的下一次王時間」排序。
            // 不改原本的倒數 / 自動輪空 / 敵吃 / 廣播 / ID 顯示邏輯。
            // 只有最後顯示時改成「最近的在最上面」。
            // ------------------------------------------------------------
            for (var i = 0; i < bossConfig.length; i++) {

                var config = bossConfig[i];
                var row = document.createElement('div');
                row.className = 'boss-row';

                var timeDisplay = '--:--:--';
                var isFlashing = false;
                var updater = '';
                var note = '';
                var displayRounds = 0;
                var isSkip = false;

                // 用來排序的時間。
                // 沒有有效時間的王會排最後。
                var sortTime = Number.POSITIVE_INFINITY;

                var dataStr = bossSpawnMap[config.name];

                if (dataStr && dataStr.indexOf('|') !== -1) {

                    var parts = dataStr.split('|');
                    var rawTime = parts[0];

                    updater = parts[1] || '';
                    note = parts[2] || '';
                    var manualReason = parts[4] || '';

                    var baseRounds =
                        parseInt(parts[3] || '0', 10);

                    if (rawTime === 'SKIP') {

                        isSkip = true;
                        timeDisplay = '手動輪空';

                        // 手動輪空沒有下一次實際時間，
                        // 排在所有有時間的王後面。
                        sortTime = Number.POSITIVE_INFINITY;

                    } else {

                        var spawnTimestamp =
                            parseInt(rawTime, 10);

                        var cdMs =
                            config.cooldown *
                            60 *
                            1000;

                        displayRounds = baseRounds;

                        if (!isNaN(spawnTimestamp)) {

                            // 🔔 出王前 1 分鐘開始閃爍提醒
                            var beforeSpawnMs =
                                spawnTimestamp - nowMs;

                            if (
                                beforeSpawnMs > 0 &&
                                beforeSpawnMs <= 60 * 1000
                            ) {
                                isFlashing = true;
                            }

                            if (nowMs >= spawnTimestamp) {

                                var overMs =
                                    nowMs -
                                    spawnTimestamp;

                                // Boss 出現後保留 10 分鐘觀察 / 擊殺時間。
                                // 超過這 10 分鐘，就自動輪空到下一輪。
                                var graceMs =
                                    10 * 60 * 1000;

                                if (overMs <= graceMs) {

                                    // 還在 10 分鐘寬限時間內
                                    isFlashing = true;

                                } else {

                                    // ★ 修正原本 10~11 分鐘之間的 BUG
                                    //
                                    // 原本：
                                    // floor((overMin - 11) / cooldown) + 1
                                    //
                                    // 在 10:00 ~ 11:00 之間可能算出 0 輪，
                                    // 導致畫面一直停在原本時間。
                                    //
                                    // 現在改成：
                                    // 超過寬限時間後，直接計算應該輪空幾輪。
                                    var dynamicRounds =
                                        Math.ceil(
                                            (overMs - graceMs) /
                                            cdMs
                                        );

                                    if (dynamicRounds < 1) {
                                        dynamicRounds = 1;
                                    }

                                    spawnTimestamp =
                                        spawnTimestamp +
                                        (dynamicRounds * cdMs);

                                    displayRounds +=
                                        dynamicRounds;
                                }
                            }

                            // ★ 這個時間就是「下一次要打的時間」
                            // 直接拿它排序，不再只比較 HH:MM:SS。
                            sortTime = spawnTimestamp;

                            var dObj =
                                new Date(
                                    spawnTimestamp
                                );

                            var hStr =
                                (dObj.getHours() < 10
                                    ? '0'
                                    : '') +
                                dObj.getHours();

                            var mStr =
                                (dObj.getMinutes() < 10
                                    ? '0'
                                    : '') +
                                dObj.getMinutes();

                            var sStr =
                                (dObj.getSeconds() < 10
                                    ? '0'
                                    : '') +
                                dObj.getSeconds();

                            timeDisplay =
                                hStr + ':' +
                                mStr + ':' +
                                sStr;
                        }
                    }
                }

                var tagClass =
                    config.isPurple
                        ? 'tag-purple'
                        : 'tag-normal';

                var tagText =
                    config.isPurple
                        ? '紫'
                        : '一般';

                var noteHtml = '';

                if (note === '敵吃') {
                    noteHtml =
                        '<span class="note-tag note-enemy">敵吃</span>';
                } else if (note === '廣播') {
                    noteHtml =
                        '<span class="note-tag note-broadcast">廣播</span>';
                } else if (note === '開機時間') {
                    noteHtml =
                        '<span class="note-tag note-maint">開機時間</span>';
                } else if (note) {
                    // 不是 1/2/3 的文字，就直接當作手動輸入原因顯示。
                    noteHtml =
                        '<span class="note-tag note-manual">📝 ' +
                        note.replace(/</g, '&lt;').replace(/>/g, '&gt;') +
                        '</span>';
                }

                if (displayRounds > 0) {
                    noteHtml +=
                        '<span class="note-tag note-autoskip">自動輪空 ' +
                        displayRounds +
                        ' 輪</span>';
                }

                var userHtml = '';

                if (updater) {
                    userHtml =
                        '<span class="user-tag">✍️ ' +
                        updater +
                        '</span>';
                }

                var timeColor = '#fff';

                if (displayRounds > 0 || isSkip) {
                    timeColor = '#ff4444';
                } else if (config.isPurple && dataStr) {
                    timeColor = 'var(--purple-theme)';
                }

                var flashClassStr =
                    isFlashing
                        ? ' class="boss-time time-flash"'
                        : ' class="boss-time"';

                row.innerHTML =
                    '<div class="boss-info">' +
                        '<div style="color:' +
                            timeColor +
                            '"' +
                            flashClassStr +
                        '>' +
                            formatBossTime(timeDisplay) +
                        '</div>' +

                        '<div class="boss-name">' +
                            '<span class="status-tag ' +
                                tagClass +
                            '">' +
                                tagText +
                            '</span>' +

                            '<strong>' +
                                (
                                    config.displayName ||
                                    config.name
                                ) +
                            '</strong>' +

                            noteHtml +
                            userHtml +
                        '</div>' +
                    '</div>' +

                    '<div class="boss-actions">' +
                        '<button class="btn-del" onclick="deleteSingleBoss(\'' +
                            config.name +
                        '\')">🗑️</button>' +
                    '</div>';

                var item = {
                    row: row,
                    sortTime: sortTime,
                    originalIndex: i
                };

                if (config.isPurple) {
                    purpleRows.push(item);
                } else {
                    normalRows.push(item);
                }
            }

            // 最近的時間排最上面。
            // 沒有登記時間 / 手動輪空的王排最後。
            function sortRows(a, b) {

                if (a.sortTime === b.sortTime) {
                    return a.originalIndex -
                           b.originalIndex;
                }

                if (
                    a.sortTime ===
                    Number.POSITIVE_INFINITY
                ) {
                    return 1;
                }

                if (
                    b.sortTime ===
                    Number.POSITIVE_INFINITY
                ) {
                    return -1;
                }

                return a.sortTime -
                       b.sortTime;
            }

            purpleRows.sort(sortRows);
            normalRows.sort(sortRows);

            // 紫王、一般王維持完全分開。
            for (var p = 0; p < purpleRows.length; p++) {
                pContain.appendChild(
                    purpleRows[p].row
                );
            }

            for (var n = 0; n < normalRows.length; n++) {
                nContain.appendChild(
                    normalRows[n].row
                );
            }
        }

        // ============================================================
        // 🚀 系統初始化
        // ============================================================
        function initSystem() {
            var localBackup =
                localStorage.getItem(localKey);

            if (localBackup) {
                try {
                    bossSpawnMap =
                        JSON.parse(localBackup);
                } catch (e) {
                    bossSpawnMap = {};
                }
            }

            if (!bossSpawnMap) {
                bossSpawnMap = {};
            }

            var savedID =
                localStorage.getItem('hms_user_id');

            if (savedID) {
                var idInput =
                    document.getElementById('user-id-input');

                if (idInput) {
                    idInput.value = savedID;
                }
            }

            renderTable();
            renderFixedBosses();
            renderCrossServerBosses();
            updateActiveIDList();
            startOnlinePresence();
            pullFromCloud();
            startRealtimeSync();

            // 每 30 秒補抓一次完整資料，作為即時同步的斷線保險。
            setInterval(
                pullFromCloud,
                30000
            );

            // 每秒更新時間、王表倒數與固定王／跨服倒數。
            setInterval(
                updateClock,
                1000
            );
        }

        function saveLocalID() {
            var input =
                document.getElementById('user-id-input');

            if (!input) return;

            var name = input.value.trim();

            localStorage.setItem(
                'hms_user_id',
                name
            );

            updateActiveIDList();

            if (presenceHeartbeatTimer) {
                clearInterval(
                    presenceHeartbeatTimer
                );
                presenceHeartbeatTimer = null;
            }

            presenceRef = null;

            if (name) {
                startOnlinePresence();
            }
        }
        var presenceRef = null;
        var presenceHeartbeatTimer = null;
        var presenceRefreshTimer = null;
        var presenceClientId = null;

        function getPresenceMemberName() {
            var input =
                document.getElementById('user-id-input');

            return input
                ? input.value.trim()
                : '';
        }

        function updateActiveIDList() {
            var container =
                document.getElementById('active-id-names');

            if (!container) return;

            var name = getPresenceMemberName();

            if (name) {
                container.innerHTML =
                    '<span class="active-id-name">🟢 ' +
                    escapeHtml(name) +
                    '</span>';
            } else {
                container.textContent =
                    '請先輸入填單人員 ID';
            }
        }

        function renderOnlineMembers(data) {
            var container =
                document.getElementById('active-id-names');

            if (!container) return;

            var names = {};

            if (data && typeof data === 'object') {
                Object.keys(data).forEach(function(key) {
                    var member = data[key];

                    if (
                        member &&
                        member.name &&
                        member.lastSeen &&
                        Date.now() -
                            Number(member.lastSeen) <
                            45000
                    ) {
                        names[member.name] = true;
                    }
                });
            }

            var selfName =
                getPresenceMemberName();

            if (selfName) {
                names[selfName] = true;
            }

            var list = Object.keys(names).sort(
                function(a, b) {
                    return a.localeCompare(
                        b,
                        'zh-Hant'
                    );
                }
            );

            if (!list.length) {
                container.textContent =
                    '目前沒有在線成員';
                return;
            }

            container.innerHTML =
                list.map(function(name) {
                    return '<span class="active-id-name">' +
                        '🟢 ' +
                        escapeHtml(name) +
                        '</span>';
                }).join('');
        }

        function presenceBaseUrl() {
            return firebaseUrl.replace(/\/+$/, '') +
                '/gludin/onlineMembers';
        }

        function startOnlinePresence() {
            var name =
                getPresenceMemberName();

            if (!name) {
                updateActiveIDList();
                return;
            }

            if (
                typeof firebaseUrl === 'undefined' ||
                !firebaseUrl
            ) {
                updateActiveIDList();
                return;
            }

            if (!presenceClientId) {
                presenceClientId =
                    sessionStorage.getItem(
                        'lineagePresenceClientId'
                    );

                if (!presenceClientId) {
                    presenceClientId =
                        'p_' +
                        Date.now().toString(36) +
                        '_' +
                        Math.random()
                            .toString(36)
                            .slice(2);

                    sessionStorage.setItem(
                        'lineagePresenceClientId',
                        presenceClientId
                    );
                }
            }

            presenceRef =
                presenceBaseUrl() +
                '/' +
                encodeURIComponent(
                    presenceClientId
                );

            // 先立即顯示自己，避免 Firebase 回應前畫面空白。
            updateActiveIDList();

            function writePresence() {
                return fetch(
                    presenceRef + '.json',
                    {
                        method: 'PUT',
                        headers: {
                            'Content-Type':
                                'application/json'
                        },
                        body: JSON.stringify({
                            name:
                                getPresenceMemberName() ||
                                name,
                            lastSeen:
                                Date.now()
                        }),
                        cache: 'no-store'
                    }
                ).then(function(response) {
                    if (!response.ok) {
                        throw new Error(
                            'HTTP ' +
                            response.status
                        );
                    }

                    loadOnlinePresence();
                });
            }

            writePresence().catch(function(error) {
                console.log(
                    '在線成員寫入失敗：',
                    error
                );

                var container =
                    document.getElementById(
                        'active-id-names'
                    );

                if (container) {
                    container.innerHTML =
                        '<span class="active-id-name">' +
                        '🟢 ' +
                        escapeHtml(name) +
                        '</span>' +
                        '<span style="color:#ff9800;margin-left:6px;">' +
                        '（雲端同步失敗）' +
                        '</span>';
                }
            });

            if (presenceHeartbeatTimer) {
                clearInterval(
                    presenceHeartbeatTimer
                );
            }

            presenceHeartbeatTimer =
                setInterval(
                    function() {
                        if (!presenceRef) return;

                        fetch(
                            presenceRef + '.json',
                            {
                                method: 'PATCH',
                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },
                                body: JSON.stringify({
                                    name:
                                        getPresenceMemberName() ||
                                        name,
                                    lastSeen:
                                        Date.now()
                                }),
                                cache: 'no-store'
                            }
                        ).catch(function(error) {
                            console.log(
                                '在線心跳失敗：',
                                error
                            );
                        });
                    },
                    15000
                );

            if (!presenceRefreshTimer) {
                presenceRefreshTimer =
                    setInterval(
                        loadOnlinePresence,
                        5000
                    );
            }

            loadOnlinePresence();

            window.addEventListener(
                'pagehide',
                function() {
                    if (!presenceRef) return;

                    fetch(
                        presenceRef + '.json',
                        {
                            method: 'DELETE',
                            keepalive: true
                        }
                    ).catch(function() {});
                }
            );
        }

        function loadOnlinePresence() {
            if (
                typeof firebaseUrl === 'undefined' ||
                !firebaseUrl
            ) {
                return;
            }

            fetch(
                presenceBaseUrl() +
                '.json?t=' +
                Date.now(),
                {
                    method: 'GET',
                    cache: 'no-store'
                }
            )
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error(
                            'HTTP ' +
                            response.status
                        );
                    }

                    return response.json();
                })
                .then(function(data) {
                    var now = Date.now();
                    var cleaned = {};

                    if (
                        data &&
                        typeof data === 'object'
                    ) {
                        Object.keys(data).forEach(
                            function(key) {
                                var member =
                                    data[key];

                                if (
                                    member &&
                                    member.name &&
                                    member.lastSeen &&
                                    now -
                                        Number(
                                            member.lastSeen
                                        ) <
                                        45000
                                ) {
                                    cleaned[key] =
                                        member;
                                } else {
                                    fetch(
                                        presenceBaseUrl() +
                                        '/' +
                                        encodeURIComponent(
                                            key
                                        ) +
                                        '.json',
                                        {
                                            method:
                                                'DELETE'
                                        }
                                    ).catch(
                                        function() {}
                                    );
                                }
                            }
                        );
                    }

                    renderOnlineMembers(
                        cleaned
                    );
                })
                .catch(function(error) {
                    console.log(
                        '在線成員讀取失敗：',
                        error
                    );

                    // 讀取失敗時至少保留目前自己的名稱。
                    updateActiveIDList();
                });
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }


        function getValidID() {
            var input =
                document.getElementById('user-id-input');

            if (!input) return null;

            var idVal =
                input.value.trim();

            if (!idVal) {
                alert(
                    '❌ 操作失敗！請先在網頁頂端輸入您的【填單人員 ID】！'
                );
                return null;
            }

            return idVal;
        }

        function updateClock() {
            var now = new Date();

            var h = now.getHours();
            var m = now.getMinutes();
            var s = now.getSeconds();

            var clock =
                document.getElementById('standard-clock');

            if (clock) {
                clock.innerText =
                    '🇹🇼 中原標準時間 ➔ ' +
                    (h < 10 ? '0' : '') + h + ':' +
                    (m < 10 ? '0' : '') + m + ':' +
                    (s < 10 ? '0' : '') + s;
            }

            renderTable();
            renderFixedBosses();
            renderCrossServerBosses();
        }



    
        // ============================================================
        // 🔐 詐騙集團專屬驗證碼
        // ============================================================
        var ALLIANCE_PASSWORD = '666666';

        function startAllianceGate() {
            var lock = document.getElementById('alliance-lock');
            var input = document.getElementById('alliance-code');

            if (!lock) return;

            if (
                localStorage.getItem('lineageAllianceUnlocked') === '1'
            ) {
                lock.style.display = 'none';
                initSystem();
            } else {
                lock.style.display = 'flex';
                if (input) input.focus();
            }
        }

        function unlockAlliance() {
            var input = document.getElementById('alliance-code');
            var lock = document.getElementById('alliance-lock');
            var error = document.getElementById('alliance-error');

            if (!input || !lock || !error) return;

            var code = String(input.value || '').trim();

            // 直接比對 666666，避免任何其他設定影響驗證。
            if (code === '666666') {
                localStorage.setItem(
                    'lineageAllianceUnlocked',
                    '1'
                );

                error.textContent = '';
                lock.style.display = 'none';
                initSystem();

            } else {
                error.textContent =
                    '❌ 驗證碼錯誤，請輸入 666666';
                input.value = '';
                input.focus();
            }
        }

        document.addEventListener(
            'DOMContentLoaded',
            function() {
                startAllianceGate();

                var input =
                    document.getElementById('alliance-code');

                if (input) {
                    input.addEventListener(
                        'keydown',
                        function(event) {
                            if (event.key === 'Enter') {
                                event.preventDefault();
                                unlockAlliance();
                            }
                        }
                    );
                }
            }
        );

        window.onload = startAllianceGate;

</script>
