<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天堂M 新篇章2.0 古魯丁專屬王表</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --gold-theme: #ffd700; --purple-theme: #b388ff; --text-color: #e0e0e0; --border-color: #333; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
        h2, h3 { margin: 10px 0; color: #fff; }
        .purple-header { color: var(--purple-theme); border-bottom: 2px solid var(--purple-theme); padding-bottom: 5px; }
        .normal-header { color: #03dac6; border-bottom: 2px solid #03dac6; padding-bottom: 5px; }
        .time-marquee { background: #311b92; color: #ffd700; font-family: monospace; font-size: 1.3rem; font-weight: bold; text-align: center; padding: 8px; border-radius: 6px; margin-bottom: 12px; border: 1px solid var(--purple-theme); box-shadow: 0 0 10px rgba(179, 136, 255, 0.3); }
        
        .id-panel { background: linear-gradient(135deg, #2c1a04, #1a1103); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #ff9800; display: flex; align-items: center; gap: 10px; }
        .input-id { padding: 8px 12px; background: #000; border: 1px solid #ff9800; color: #ffd700; border-radius: 4px; font-weight: bold; font-size: 0.95rem; flex-grow: 1; }
        
        .control-panel { background: #262626; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .maint-zone { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .input-time { padding: 8px 10px; background: #121212; border: 1px solid #555; color: #fff; border-radius: 4px; font-family: monospace; font-size: 0.9rem; width: 140px; text-align: center; }
        .btn-action { background: #03dac6; color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-reset { background: #cf6679; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        
        .btn-zone { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .boss-btn-purple { background: linear-gradient(135deg, #4a148c, #311b92); color: #fff; border: 2px solid var(--purple-theme); padding: 10px 5px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; text-shadow: 1px 1px 2px #000; width: 100%; }
        .boss-btn-normal { background: #2c2c2c; color: #e0e0e0; border: 1px solid #555; padding: 8px 5px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: 100%; }
        
        .boss-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .boss-row { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); }
        .boss-info { display: flex; align-items: center; gap: 10px; }
        .boss-time { font-size: 1.1rem; font-weight: bold; font-family: monospace; min-width: 85px; color: #fff; text-align: left; }
        .boss-name { font-size: 0.9rem; }
        
        .boss-actions { display: flex; gap: 5px; }
        .btn-del { padding: 5px 8px; font-size: 0.8rem; background: #5c2514; border: 1px solid #e64a19; color: #ffab91; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .user-tag { font-size: 0.7rem; padding: 1px 5px; border-radius: 3px; background: #333; color: #ffb74d; border: 1px solid #ff9800; margin-left: 6px; font-family: monospace; font-weight: bold; }
        
        .status-tag { font-size: 0.7rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-right: 4px; }
        .tag-purple { background: rgba(179, 136, 255, 0.15); color: var(--purple-theme); border: 1px solid var(--purple-theme); }
        .tag-normal { background: rgba(3, 218, 198, 0.15); color: #03dac6; border: 1px solid #03dac6; }
        
        .note-tag { font-size: 0.7rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-left: 4px; }
        .note-enemy { background: #520000; color: #ff8888; border: 1px solid #ff4444; }
        .note-broadcast { background: #002b52; color: #88ccff; border: 1px solid #3399ff; }
        .note-maint { background: #1b5e20; color: #a5d6a7; border: 1px solid #4caf50; }
        .note-autoskip { background: #4a0007; color: #ff8a80; border: 1px solid #ff5252; font-weight: bold; padding: 2px 5px; }

        @keyframes flash-warning { 0% { color: #ffd700; opacity: 1; } 50% { color: #ff5722; opacity: 0.4; } 100% { color: #ffd700; opacity: 1; } }
        .time-flash { animation: flash-warning 1s infinite; font-weight: 900; text-shadow: 0 0 5px rgba(255,87,34,0.6); }
    </style>
</head>
<body>
    <h2>🕒 天堂M 新篇章2.0 古魯丁專屬王表</h2>
    <div id="standard-clock" class="time-marquee">🇹🇼 中原標準時間 ➔ ⏳ 系統校時中...</div>

    <div class="id-panel">
        <span style="color: #ff9800; font-weight: bold; font-size: 0.9rem;">🔑 填單人員 ID：</span>
        <input type="text" id="user-id-input" class="input-id" placeholder="請先輸入您的遊戲內ID（必填）" oninput="saveLocalID()">
    </div>

    <div class="control-panel">
        <div class="maint-zone">
            <span style="color: #03dac6; font-weight: bold; font-size: 0.85rem;">🗓️ 跨日開機輸入：</span>
            <input type="text" id="maint-start-input" class="input-time" placeholder="例如08201030 (8/20 10:30)">
            <button class="btn-action" onclick="setMaintenanceTime()">📢 計算輪空並同步全盟</button>
        </div>
        <button class="btn-reset" onclick="resetToMaintenance()">全面重置雲端王表</button>
    </div>
    
    <div class="btn-zone">
        <h3 style="color: var(--purple-theme); margin-top:0; font-size:0.9rem;">🌟 點擊按鈕回報戰況：【全盟友手機 0.5 秒即時大同步，無須重新整理】</h3>
        <div class="btn-grid" id="purple-btns">
            <button class="boss-btn-purple" onclick="quickReportKill('賽尼斯的分身')">賽尼斯分身</button>
            <button class="boss-btn-purple" onclick="quickReportKill('死亡騎士')">死亡騎士</button>
            <button class="boss-btn-purple" onclick="quickReportKill('巨大飛龍')">巨大飛龍</button>
            <button class="boss-btn-purple" onclick="quickReportKill('暗黑大將軍貝里斯')">貝里斯</button>
            <button class="boss-btn-purple" onclick="quickReportKill('不死鳥')">不死鳥</button>
            <button class="boss-btn-purple" onclick="quickReportKill('古代巨人')">古代巨人</button>
            <button class="boss-btn-purple" onclick="quickReportKill('克特')">克特</button>
        </div>
        <div class="btn-grid" id="normal-btns">
            <button class="boss-btn-normal" onclick="quickReportKill('伊弗利特')" style="border: 1px solid #03dac6; background: #223333; color: #03dac6; font-weight: bold;">伊弗利特</button>
            <button class="boss-btn-normal" onclick="quickReportKill('881left飛龍')">881左飛龍</button>
            <button class="boss-btn-normal" onclick="quickReportKill('882right飛龍')">882右飛龍</button>
            <button class="boss-btn-normal" onclick="quickReportKill('綠王')">綠王</button>
            <button class="boss-btn-normal" onclick="quickReportKill('紅王')">紅王</button>
            <button class="boss-btn-normal" onclick="quickReportKill('四色')">四色</button>
            <button class="boss-btn-normal" onclick="quickReportKill('巨型蠕蟲(海底)')">海底蠕蟲</button>
            <button class="boss-btn-normal" onclick="quickReportKill('大黑長者')">大黑長者</button>
            <button class="boss-btn-normal" onclick="quickReportKill('85飛龍')">85飛龍</button>
            <button class="boss-btn-normal" onclick="quickReportKill('87飛龍')">87飛龍</button>
            <button class="boss-btn-normal" onclick="quickReportKill('強盜頭目')">強盜頭目</button>
            <button class="boss-btn-normal" onclick="quickReportKill('樹精')">樹精</button>
            <button class="boss-btn-normal" onclick="quickReportKill('巨大鱷魚')">巨大鱷魚</button>
            <button class="boss-btn-normal" onclick="quickReportKill('大腳瑪幽')">大腳瑪幽</button>
            <button class="boss-btn-normal" onclick="quickReportKill('變形怪首領')">變形怪首領</button>
            <button class="boss-btn-normal" onclick="quickReportKill('巨大守護螞蟻')">守護螞蟻</button>
            <button class="boss-btn-normal" onclick="quickReportKill('奈克諾斯')">奈克諾斯</button>
            <button class="boss-btn-normal" onclick="quickReportKill('蜘蛛')">蜘蛛</button>
            <button class="boss-btn-normal" onclick="quickReportKill('力卡溫')">力卡溫</button>
            <button class="boss-btn-normal" onclick="quickReportKill('惡魔監視者')">惡魔監視者</button>
            <button class="boss-btn-normal" onclick="quickReportKill('烏勒庫斯')">烏勒庫斯</button>
            <button class="boss-btn-normal" onclick="quickReportKill('卡司特王')">卡司特王</button>
        </div>
    </div>
    
    <h3 class="purple-header">👑 傳說級物品掉落 BOSS 倒數</h3>
    <div id="purple-boss-container" class="boss-list"></div>
    
    <h3 class="normal-header">⚔️ 一般野外 BOSS 倒數</h3>
    <div id="normal-boss-container" class="boss-list"></div>
    <script>
        // 🔒 使用專為古魯丁搭建的全新純文字儲存對應鏈，杜絕任何物件破壞
        var firebaseUrl = "https://firebaseio.com";
        var localKey = "lineagem_gludin_pure_map_v6";
        
        var bossConfig = [
            { name: "賽尼斯的分身", cooldown: 180, isPurple: true }, { name: "死亡騎士", cooldown: 240, isPurple: true }, { name: "巨大飛龍", cooldown: 360, isPurple: true }, { name: "暗黑大將軍貝里斯", cooldown: 360, isPurple: true }, { name: "不死鳥", cooldown: 480, isPurple: true }, { name: "古代巨人", cooldown: 510, isPurple: true }, { name: "克特", cooldown: 600, isPurple: true },
            { name: "伊弗利特", cooldown: 120, isPurple: false }, { name: "881left飛龍", displayName: "881左飛龍", cooldown: 120, isPurple: false }, { name: "882right飛龍", displayName: "882右飛龍", cooldown: 120, isPurple: false }, { name: "綠王", cooldown: 120, isPurple: false }, { name: "紅王", cooldown: 120, isPurple: false }, { name: "四色", cooldown: 120, isPurple: false }, { name: "巨型蠕蟲(海底)", cooldown: 120, isPurple: false }, { name: "大黑長者", cooldown: 180, isPurple: false }, { name: "85飛龍", cooldown: 180, isPurple: false }, { name: "87飛龍", cooldown: 180, isPurple: false }, { name: "強盜頭目", cooldown: 180, isPurple: false }, { name: "樹精", cooldown: 180, isPurple: false }, { name: "巨大鱷魚", cooldown: 180, isPurple: false }, { name: "大腳瑪幽", cooldown: 180, isPurple: false }, { name: "變形怪首領", cooldown: 210, isPurple: false }, { name: "巨大守護螞蟻", cooldown: 210, isPurple: false }, { name: "奈克諾斯", cooldown: 240, isPurple: false }, { name: "蜘蛛", cooldown: 240, isPurple: false }, { name: "力卡溫", cooldown: 480, isPurple: false }, { name: "惡魔監視者", cooldown: 360, isPurple: false }, { name: "烏勒庫斯", cooldown: 360, isPurple: false }, { name: "卡司特王", cooldown: 450, isPurple: false }
        ];
        
        // 核心字典：只存 {"王名": "時間戳|填單人|標記|基礎輪空"} 這種純文字，100% 絕對能永久儲存！
        var bossSpawnMap = {}; 

        function initSystem() {
            // 一開網頁，光速從手機鋼印拉出文字資料，拒絕 `--:--:--` 空白
            var localBackup = localStorage.getItem(localKey);
            if (localBackup) {
                try { bossSpawnMap = JSON.parse(localBackup); } catch(e) { bossSpawnMap = {}; }
            }
            if (!bossSpawnMap) { bossSpawnMap = {}; }
            
            var savedID = localStorage.getItem('hms_user_id');
            if(savedID) { document.getElementById('user-id-input').value = savedID; }
            
            renderTable();
            pullFromCloud();
            setInterval(pullFromCloud, 2500); // 每2.5秒高鐵同步
            setInterval(updateClock, 1000);
        }
        
        function saveLocalID() {
            var idVal = document.getElementById('user-id-input').value.trim();
            localStorage.setItem('hms_user_id', idVal);
        }
        
        function getValidID() {
            var idVal = document.getElementById('user-id-input').value.trim();
            if(!idVal) { alert('❌ 操作失敗！請先在網頁頂端輸入您的【填單人員 ID】！'); return null; }
            return idVal;
        }
        
        function updateClock() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            document.getElementById('standard-clock').innerText = "🇹🇼 中原標準時間 ➔ " + (h<10?'0':'')+h + ':' + (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
            renderTable();
        }

        // Firebase 智慧文字鏈讀取
        function pullFromCloud() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", firebaseUrl + "?nocache=" + new Date().getTime(), true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var res = JSON.parse(xhr.responseText);
                        if (res && typeof res === 'object') {
                            // 檢查雲端是不是空的
                            var isCloudEmpty = true;
                            for (var k in res) { if(res[k]) { isCloudEmpty = false; break; } }
                            
                            if (!isCloudEmpty) {
                                bossSpawnMap = res;
                                localStorage.setItem(localKey, JSON.stringify(bossSpawnMap));
                                renderTable();
                            } else {
                                // 雲端空了但手機有資料，反向灌回雲端
                                var hasLocal = false;
                                for (var k in bossSpawnMap) { if(bossSpawnMap[k]) { hasLocal = true; break; } }
                                if(hasLocal) { pushToCloud(); }
                            }
                        }
                    } catch(e) {}
                }
            };
            xhr.send();
        }
        
        function pushToCloud() {
            localStorage.setItem(localKey, JSON.stringify(bossSpawnMap));
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", firebaseUrl, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.send(JSON.stringify(bossSpawnMap));
            renderTable(); 
        }
        // 🛠️ 歷史級功能：將計算好的時間戳記以「純字串」格式寫入字典，徹底封死歸零漏洞
        function setMaintenanceTime() {
            var myID = getValidID(); if(!myID) return;
            var inputEl = document.getElementById('maint-start-input'); var val = inputEl.value.trim().replace(/[:\/ ]/g, '');
            if (!/^\d{8}$/.test(val)) { alert('請輸入精確的 8 位數開機月日時間！\n例如：08201030 (8月20日 10:30)'); return; }
            
            var currentYear = new Date().getFullYear();
            var m = parseInt(val.substring(0, 2), 10) - 1; var d = parseInt(val.substring(2, 4), 10);
            var h = parseInt(val.substring(4, 6), 10); var min = parseInt(val.substring(6, 8), 10);
            
            var maintDate = new Date(currentYear, m, d, h, min, 0);
            if (isNaN(maintDate.getTime())) { alert('時間格式錯誤！'); return; }
            
            var now = new Date(); if (maintDate > now) { alert('設定時間不能比現在晚！'); return; }
            if (!confirm('確認要以開機時間起算並同步全盟嗎？')) return;
            
            var nowMs = now.getTime();
            bossSpawnMap = {}; // 初始化字典
            
            for (var i = 0; i < bossConfig.length; i++) {
                var config = bossConfig[i];
                var cdMs = config.cooldown * 60 * 1000;
                var firstSpawnMs = maintDate.getTime() + cdMs;
                
                var finalTimestamp = firstSpawnMs;
                var passedRounds = 0;
                
                if (nowMs >= firstSpawnMs) {
                    var elapsedMs = nowMs - firstSpawnMs;
                    passedRounds = Math.floor(elapsedMs / cdMs) + 1;
                    finalTimestamp = firstSpawnMs + (passedRounds * cdMs);
                }
                
                // 🌟 用「純文字組合」存入字典：時間戳|填單人|標記|基礎輪空
                bossSpawnMap[config.name] = finalTimestamp + "|" + myID + "|開機時間|" + passedRounds;
            }
            pushToCloud(); inputEl.value = ''; alert('⚙️ 鋼印字典打包成功！多輪數據已鎖死上傳！');
        }

        function quickReportKill(bossName) {
            var myID = getValidID(); if(!myID) return;
            var now = new Date();
            var curTimeString = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes() + ':' + (now.getSeconds() < 10 ? '0' : '') + now.getSeconds();
            
            var userInput = prompt('確認【' + bossName + '】死亡時間：', curTimeString); 
            if (userInput === null) return;
            
            var cleanInput = userInput.replace(/:/g, '').trim(); 
            if (cleanInput === '') {
                // 手動輪空字串包
                bossSpawnMap[bossName] = "SKIP|" + myID + "||0";
                pushToCloud(); return;
            }
            
            var killH, killM, killS = 0;
            if (cleanInput.length === 4) { killH = parseInt(cleanInput.substring(0, 2), 10); killM = parseInt(cleanInput.substring(2, 4), 10); }
            else if (cleanInput.length === 6) { killH = parseInt(cleanInput.substring(0, 2), 10); killM = parseInt(cleanInput.substring(2, 4), 10); killS = parseInt(cleanInput.substring(4, 6), 10); }
            else { alert('格式錯誤！'); return; }
            
            var noteInput = prompt('請選擇狀態標記：\n輸入 1 ➔ 敵吃\n輸入 2 ➔ 廣播\n輸入 3 ➔ 開機時間\n直接確定(留白) ➔ 正常計算', '');
            var bossNote = ""; if (noteInput === "1") { bossNote = "敵吃"; } else if (noteInput === "2") { bossNote = "廣播"; } else if (noteInput === "3") { bossNote = "開機時間"; }

            var targetDate = new Date(); targetDate.setHours(killH, killM, killS, 0);
            var nextSpawn = targetDate.getTime() + (getCooldown(bossName) * 60 * 1000);
            
            // 寫入純文字鏈
            bossSpawnMap[bossName] = nextSpawn + "|" + myID + "|" + bossNote + "|0";
            pushToCloud();
        }
        
        function getCooldown(name) {
            for(var i=0; i<bossConfig.length; i++) { if(bossConfig[i].name === name) return bossConfig[i].cooldown; }
            return 120;
        }
        function deleteSingleBoss(bossName) {
            var myID = getValidID(); if(!myID) return;
            if (confirm('確定要清除【' + bossName + '】的紀錄嗎？')) {
                bossSpawnMap[bossName] = "";
                pushToCloud();
            }
        }
        
        function resetToMaintenance() { 
            if (confirm('🚨 注意！這將會強制清空雲端與本地的所有數據，確認嗎？')) { 
                bossSpawnMap = {};
                pushToCloud(); 
            } 
        }
        
        function renderTable() {
            var pContain = document.getElementById('purple-boss-container'), nContain = document.getElementById('normal-boss-container'); 
            if(!pContain || !nContain) return; pContain.innerHTML = ''; nContain.innerHTML = '';
            
            var nowMs = new Date().getTime();

            for (var i = 0; i < bossConfig.length; i++) {
                var config = bossConfig[i];
                var row = document.createElement('div'); row.className = 'boss-row'; 
                
                var timeDisplay = '--:--:--'; var isFlashing = false;
                var updater = ""; var note = ""; var displayRounds = 0; var isSkip = false;
                
                // 從純文字字典拆解數據
                var dataStr = bossSpawnMap[config.name];
                if (dataStr && dataStr.indexOf('|') !== -1) {
                    var parts = dataStr.split('|');
                    var rawTime = parts[0];
                    updater = parts[1] || "";
                    note = parts[2] || "";
                    var baseRounds = parseInt(parts[3] || "0", 10);
                    
                    if (rawTime === "SKIP") {
                        isSkip = true;
                        timeDisplay = '手動輪空';
                    } else {
                        var spawnTimestamp = parseInt(rawTime, 10);
                        var cdMs = config.cooldown * 60 * 1000;
                        displayRounds = baseRounds;
                        
                        // 時間又過期了，動態累加輪空
                        if (nowMs >= spawnTimestamp) {
                            var overMs = nowMs - spawnTimestamp;
                            var overMin = overMs / (60 * 1000);
                            if (overMin <= 10) {
                                isFlashing = true;
                            } else {
                                var dynamicRounds = Math.floor((overMin - 11) / config.cooldown) + 1;
                                spawnTimestamp = spawnTimestamp + (dynamicRounds * cdMs);
                                displayRounds += dynamicRounds;
                            }
                        }
                        
                        // 🌟 純淨時間：拔除月日，只留 時:分:秒
                        var dObj = new Date(spawnTimestamp);
                        var hStr = (dObj.getHours() < 10 ? '0' : '') + dObj.getHours();
                        var mStr = (dObj.getMinutes() < 10 ? '0' : '') + dObj.getMinutes();
                        var sStr = (dObj.getSeconds() < 10 ? '0' : '') + dObj.getSeconds();
                        timeDisplay = hStr + ':' + mStr + ':' + sStr;
                    }
                }
                
                var tagClass = config.isPurple ? 'tag-purple' : 'tag-normal', tagText = config.isPurple ? '紫' : '一般';
                var noteHtml = "";
                if (note === "敵吃") { noteHtml = '<span class="note-tag note-enemy">敵吃</span>'; } 
                else if (note === "廣播") { noteHtml = '<span class="note-tag note-broadcast">廣播</span>'; }
                else if (note === "開機時間") { noteHtml = '<span class="note-tag note-maint">開機時間</span>'; }
                
                if (displayRounds > 0) { 
                    noteHtml += '<span class="note-tag note-autoskip">自動輪空 ' + displayRounds + ' 輪</span>'; 
                }
                
                var userHtml = ""; if (updater) { userHtml = '<span class="user-tag">✍️ ' + updater + '</span>'; }
                var timeColor = '#fff';
                if (displayRounds > 0 || isSkip) { timeColor = '#ff4444'; } 
                else if (config.isPurple && dataStr) { timeColor = 'var(--purple-theme)'; }
                
                var flashClassStr = isFlashing ? ' class="boss-time time-flash"' : ' class="boss-time"';
                row.innerHTML = '<div class="boss-info"><div style="color:' + timeColor + '"' + flashClassStr + '>' + timeDisplay + '</div><div class="boss-name"><span class="status-tag ' + tagClass + '">' + tagText + '</span><strong>' + (config.displayName || config.name) + '</strong>' + noteHtml + userHtml + '</div></div><div class="boss-actions"><button class="btn-del" onclick="deleteSingleBoss(\'' + config.name + '\')">🗑️</button></div>';
                
                if (config.isPurple) { pContain.appendChild(row); } else { nContain.appendChild(row); }
            }
        }
        window.onload = initSystem;
    </script>
</body>
</html>
