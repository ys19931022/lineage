<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>天堂M 新篇章1.0 詐騙集團專屬王表</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --gold-theme: #ffd700; --purple-theme: #b388ff; --text-color: #e0e0e0; --border-color: #333; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
        h2, h3 { margin: 10px 0; color: #fff; }
        .purple-header { color: var(--purple-theme); border-bottom: 2px solid var(--purple-theme); padding-bottom: 5px; }
        .normal-header { color: #03dac6; border-bottom: 2px solid #03dac6; padding-bottom: 5px; }
        .time-marquee { background: #311b92; color: #ffd700; font-family: monospace; font-size: 1.3rem; font-weight: bold; text-align: center; padding: 8px; border-radius: 6px; margin-bottom: 12px; border: 1px solid var(--purple-theme); box-shadow: 0 0 10px rgba(179, 136, 255, 0.3); }
        
        .id-panel { background: linear-gradient(135deg, #2c1a04, #1a1103); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #ff9800; display: flex; align-items: center; gap: 10px; }
        .input-id { padding: 8px 12px; background: #000; border: 1px solid #ff9800; color: #ffd700; border-radius: 4px; font-weight: bold; font-size: 0.95rem; flex-grow: 1; }
        
        .control-panel { background: #262626; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .maint-zone { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .input-time { padding: 8px 10px; background: #121212; border: 1px solid #555; color: #fff; border-radius: 4px; font-family: monospace; font-size: 0.9rem; width: 140px; text-align: center; }
        .btn-action { background: #03dac6; color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-reset { background: #cf6679; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        
        .btn-zone { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .boss-btn-purple { background: linear-gradient(135deg, #4a148c, #311b92); color: #fff; border: 2px solid var(--purple-theme); padding: 10px 5px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; text-shadow: 1px 1px 2px #000; width: 100%; }
        .boss-btn-normal { background: #2c2c2c; color: #e0e0e0; border: 1px solid #555; padding: 8px 5px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: 100%; }
        
        .fixed-header { color: #ffb300; border-bottom: 2px solid #ffb300; padding-bottom: 5px; }
        .fixed-row { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 9px 12px; border-radius: 6px; border: 1px solid #5a4a22; }
        .fixed-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .fixed-next { font-size: 1.1rem; font-weight: bold; font-family: monospace; min-width: 85px; color: #ffcf33; text-align: left; }
        .fixed-name { font-size: 0.9rem; font-weight: bold; min-width: 115px; }
        .fixed-schedule { font-size: 0.8rem; color: #ccc; line-height: 1.5; }
        .fixed-soon { color: #ff5252; font-weight: bold; }
        .fixed-countdown { font-size: 0.78rem; color: #aaa; font-family: monospace; white-space: nowrap; }
        .voice-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #262626;
            padding: 7px 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #444;
        }
        .voice-label {
            font-size: 0.82rem;
            color: #ddd;
        }
        .voice-toggle {
            min-width: 58px;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid #555;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .voice-toggle.off {
            background: #333;
            color: #aaa;
        }
        .voice-toggle.on {
            background: #1b8f5a;
            color: #fff;
            border-color: #35c77b;
        }
        #voice-status {
            font-size: 0.75rem;
            color: #aaa;
        }
        .cross-server-header {
            color: #ffb74d;
            border-bottom: 2px solid #ffb74d;
            padding-bottom: 5px;
        }

        .cross-server-group {
            margin-top: 10px;
            background: transparent;
        }

        .cross-server-group-title {
            background: #242424;
            color: #ffcc80;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px 10px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .cross-server-period {
            background: #2a241b;
            color: #ffcc80;
            border: 1px solid #6d5430;
            border-radius: 6px;
            padding: 8px 10px;
            font-weight: bold;
        }

        .cross-row {
            display: grid;
            grid-template-columns: 75px minmax(0, 1fr) 150px;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .cross-row:hover {
            background: #292929;
            border-color: #777;
        }

        .cross-time {
            font-family: monospace;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .cross-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .cross-info span {
            font-size: 0.82rem;
            color: #ddd;
        }

        .cross-info small {
            color: #ffcc80;
            font-size: 0.72rem;
        }

        .cross-countdown {
            text-align: right;
            font-family: monospace;
            font-size: 0.82rem;
            color: #aaa;
        }

        .cross-soon .cross-time,
        .cross-soon .cross-countdown {
            color: #ffb74d;
            font-weight: bold;
        }

        .boss-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .boss-row { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); }
        /* 滑鼠移入整列高亮，方便辨認這一列對應的清空按鈕 */
        .boss-row {
            transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .boss-row:hover {
            background: #292929;
            border-color: #777;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .boss-row:hover .boss-time {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.25);
        }

        .boss-info { display: flex; align-items: center; gap: 10px; }
        .boss-time { font-size: 1.1rem; font-weight: bold; font-family: monospace; min-width: 85px; color: #fff; text-align: left; }
        .boss-name { font-size: 0.9rem; }
        
        .boss-actions { display: flex; gap: 5px; }
        .btn-del { padding: 5px 8px; font-size: 0.8rem; background: #5c2514; border: 1px solid #e64a19; color: #ffab91; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .user-tag { font-size: 0.7rem; padding: 1px 5px; border-radius: 3px; background: #333; color: #ffb74d; border: 1px solid #ff9800; margin-left: 6px; font-family: monospace; font-weight: bold; }
        
        .status-tag { font-size: 0.7rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-right: 4px; }
        .tag-purple { background: rgba(179, 136, 255, 0.15); color: var(--purple-theme); border: 1px solid var(--purple-theme); }
        .tag-normal { background: rgba(3, 218, 198, 0.15); color: #03dac6; border: 1px solid #03dac6; }
        
        .note-tag { font-size: 0.7rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-left: 4px; }
        .note-manual { background: rgba(255, 193, 7, 0.15); color: #ffd54f; border: 1px solid #ffb300; }
        .note-enemy { background: #520000; color: #ff8888; border: 1px solid #ff4444; }
        .note-broadcast { background: #002b52; color: #88ccff; border: 1px solid #3399ff; }
        .note-maint { background: #1b5e20; color: #a5d6a7; border: 1px solid #4caf50; }
        .note-autoskip { background: #4a0007; color: #ff8a80; border: 1px solid #ff5252; font-weight: bold; padding: 2px 5px; }


        /* ============================================================
           📱 手機版優化
           不改資料、不改同步、不改 Boss 邏輯，只改善排版。
           ============================================================ */
        @media (max-width: 600px) {

            body {
                padding: 8px;
                overflow-x: hidden;
            }

            h2 {
                font-size: 1.05rem;
                margin: 6px 0 8px;
            }

            h3 {
                font-size: 0.95rem;
            }

            .time-marquee {
                font-size: 0.95rem;
                padding: 7px 5px;
                margin-bottom: 8px;
            }

            .id-panel {
                padding: 9px;
                gap: 7px;
                margin-bottom: 8px;
            }

            .id-panel > span {
                font-size: 0.78rem !important;
                white-space: nowrap;
            }

            .input-id {
                min-width: 0;
                padding: 7px 9px;
                font-size: 0.85rem;
            }

            .control-panel {
                padding: 9px;
                gap: 8px;
                margin-bottom: 10px;
            }

            .maint-zone {
                width: 100%;
                gap: 6px;
            }

            .maint-zone > span {
                width: 100%;
                font-size: 0.78rem !important;
            }

            .input-time {
                flex: 1;
                min-width: 0;
                width: auto;
                font-size: 0.82rem;
                padding: 7px 6px;
            }

            .btn-action {
                flex: 1;
                min-width: 0;
                padding: 7px 5px;
                font-size: 0.75rem;
                white-space: nowrap;
            }

            .btn-reset {
                width: 100%;
                padding: 7px 8px;
                font-size: 0.78rem;
            }

            .btn-zone {
                padding: 9px;
                margin-bottom: 14px;
            }

            .btn-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 5px;
                margin-bottom: 9px;
            }

            .boss-btn-purple,
            .boss-btn-normal {
                min-width: 0;
                padding: 8px 3px;
                font-size: 0.72rem;
                white-space: normal;
                line-height: 1.2;
            }

            /* ★ 王卡片：時間 / 資訊 / 刪除按鈕不再互相擠壓 */
            .boss-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: center;
                gap: 6px;
                padding: 9px 8px;
            }

            .boss-info {
                display: grid;
                grid-template-columns: 82px minmax(0, 1fr);
                align-items: center;
                gap: 6px;
                min-width: 0;
            }

            .boss-time {
                min-width: 0;
                font-size: 0.98rem;
                line-height: 1.15;
                white-space: nowrap;
            }

            .boss-name {
                min-width: 0;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 3px;
                line-height: 1.35;
                overflow-wrap: anywhere;
            }

            .boss-name strong {
                font-size: 0.88rem;
                max-width: 100%;
            }

            .status-tag,
            .note-tag {
                font-size: 0.63rem;
                padding: 1px 3px;
                margin: 0;
                white-space: nowrap;
            }

            .user-tag {
                font-size: 0.62rem;
                margin: 0;
                padding: 1px 4px;
                white-space: nowrap;
            }

            .boss-actions {
                flex-shrink: 0;
                gap: 0;
            }

            .btn-del {
                width: 38px;
                height: 38px;
                padding: 0;
                font-size: 0.95rem;
            }

            .boss-list {
                gap: 6px;
                margin-bottom: 15px;
            }

            /* ★ 固定王手機版 */
            .fixed-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 4px;
                padding: 8px 9px;
            }

            .fixed-info {
                display: grid;
                grid-template-columns: 70px minmax(0, 1fr);
                gap: 5px;
                align-items: center;
            }

            .fixed-next {
                min-width: 0;
                font-size: 0.92rem;
            }

            .fixed-name {
                min-width: 0;
                font-size: 0.86rem;
            }

            .fixed-schedule {
                grid-column: 2;
                font-size: 0.7rem;
                overflow-wrap: anywhere;
            }

            .fixed-countdown {
                text-align: right;
                font-size: 0.72rem;
            }

            .voice-panel {
                padding: 6px 8px;
                gap: 6px;
                margin-bottom: 8px;
            }
            .voice-label { font-size: 0.74rem; }
            .voice-toggle {
                min-width: 52px;
                padding: 5px 8px;
                font-size: 0.7rem;
            }
            #voice-status { font-size: 0.68rem; }

            .cross-server-header {
                padding-bottom: 4px;
            }

            .cross-server-group {
                margin-top: 9px;
            }

            .cross-server-group-title {
                padding: 7px 8px;
                font-size: 0.78rem;
            }

            .cross-row {
                grid-template-columns: 62px minmax(0, 1fr);
                gap: 5px;
                padding: 8px 9px;
            }

            .cross-time {
                font-size: 0.92rem;
            }

            .cross-info span {
                font-size: 0.76rem;
            }

            .cross-info small {
                font-size: 0.66rem;
            }

            .cross-countdown {
                grid-column: 2;
                text-align: right;
                font-size: 0.7rem;
            }

            .fixed-header,
            .purple-header,
            .normal-header {
                padding-bottom: 4px;
            }
        }

        @keyframes flash-warning { 0% { color: #ffd700; opacity: 1; } 50% { color: #ff5722; opacity: 0.4; } 100% { color: #ffd700; opacity: 1; } }
        .time-flash {
            animation: flash-warning 1s infinite !important;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(255,87,34,0.9);
        }

        /* 出王前 1 分鐘：讓時間本身明顯閃爍 */
        @keyframes flash-warning {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.35;
                transform: scale(1.04);
            }
        }
        .boss-time .seconds {
            font-size: 0.68em;
            opacity: 0.85;
        }

    
        /* 🔐 血盟專屬驗證：未驗證前隱藏王表 */
        #alliance-lock {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 8, 12, 0.97);
            padding: 20px;
            box-sizing: border-box;
        }
        .lock-card {
            width: min(420px, 100%);
            background: #1e1e1e;
            border: 1px solid #b388ff;
            border-radius: 14px;
            padding: 28px 22px;
            box-shadow: 0 0 30px rgba(179, 136, 255, 0.25);
            text-align: center;
        }
        .lock-title {
            color: #ffd700;
            font-size: 1.45rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .lock-subtitle {
            color: #bbb;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }
        #alliance-code {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #101010;
            color: #fff;
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 0.25em;
            outline: none;
        }
        #alliance-code:focus { border-color: #b388ff; }
        #alliance-unlock {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            border: 0;
            border-radius: 8px;
            background: #b388ff;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }
        #alliance-error {
            min-height: 20px;
            margin-top: 10px;
            color: #ff667d;
            font-size: 0.85rem;
            font-weight: bold;
        }
</style>
</head>
<body>
    <div id="alliance-lock">
        <div class="lock-card">
            <div class="lock-title">🔐 磐門 血盟專屬王表</div>
            <div class="lock-subtitle">請輸入血盟專屬驗證碼後使用</div>
            <input id="alliance-code" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="輸入 6 位驗證碼">
            <button id="alliance-unlock" type="button" onclick="unlockAlliance()">進入王表</button>
            <div id="alliance-error"></div>
        </div>
    </div>

    <h2>🕒 天堂M 新篇章1.0 詐騙集團專屬王表</h2>
    <div class="voice-panel">
        <span class="voice-label">🔊 語音提醒</span>
        <button id="voice-toggle-btn" class="voice-toggle off" onclick="toggleVoiceAlerts()">OFF</button>
        <span id="voice-status">關閉</span>
    </div>
    <div id="standard-clock" class="time-marquee">🇹🇼 中原標準時間 ➔ ⏳ 系統校時中...</div>

    <div class="id-panel">
        <span style="color: #ff9800; font-weight: bold; font-size: 0.9rem;">🔑 填單人員 ID：</span>
        <input type="text" id="user-id-input" class="input-id" placeholder="請先輸入您的遊戲內ID（必填）" oninput="saveLocalID()">
    </div>

    <div class="control-panel">
        <div class="maint-zone">
            <span style="color: #03dac6; font-weight: bold; font-size: 0.85rem;">🗓️ 維修結束時間輸入：</span>
            <input type="text" id="maint-start-input" class="input-time" placeholder="例如08201030 (8/20 10:30)">
            <button class="btn-action" onclick="setMaintenanceTime()">📢 開機時間確認</button>
        </div>
        <button class="btn-reset" onclick="resetToMaintenance()">王表時間全部重置</button>
    </div>
    
    <div class="btn-zone">
        <h3 style="color: var(--purple-theme); margin-top:0; font-size:0.9rem;">🌟 點擊按鈕回報戰況：【全盟友手機 0.5 秒即時大同步，無須重新整理】</h3>
        <div class="btn-grid" id="purple-btns">
            <button class="boss-btn-purple" onclick="quickReportKill('賽尼斯的分身')">賽尼斯分身</button>
            <button class="boss-btn-purple" onclick="quickReportKill('死亡騎士')">死亡騎士</button>
            <button class="boss-btn-purple" onclick="quickReportKill('巨大飛龍')">巨大飛龍</button>
            <button class="boss-btn-purple" onclick="quickReportKill('暗黑大將軍貝里斯')">貝里斯</button>
            <button class="boss-btn-purple" onclick="quickReportKill('不死鳥')">不死鳥</button>
            <button class="boss-btn-purple" onclick="quickReportKill('古代巨人')">古代巨人</button>
            <button class="boss-btn-purple" onclick="quickReportKill('克特')">克特</button>
        </div>
        <div class="btn-grid" id="normal-btns">
            <button class="boss-btn-normal" onclick="quickReportKill('伊弗利特')">伊弗利特</button>
            <button class="boss-btn-normal" onclick="quickReportKill('881left飛龍')">881左飛龍</button>
            <button class="boss-btn-normal" onclick="quickReportKill('882right飛龍')">882右飛龍</button>
            <button class="boss-btn-normal" onclick="quickReportKill('綠王')">綠王</button>
            <button class="boss-btn-normal" onclick="quickReportKill('紅王')">紅王</button>
            <button class="boss-btn-normal" onclick="quickReportKill('四色')">四色</button>
            <button class="boss-btn-normal" onclick="quickReportKill('巨型蠕蟲(海底)')">海底蠕蟲</button>
            <button class="boss-btn-normal" onclick="quickReportKill('大黑長者')">大黑長者</button>
            <button class="boss-btn-normal" onclick="quickReportKill('85飛龍')">85飛龍</button>
            <button class="boss-btn-normal" onclick="quickReportKill('87飛龍')">87飛龍</button>
            <button class="boss-btn-normal" onclick="quickReportKill('強盜頭目')">強盜頭目</button>
            <button class="boss-btn-normal" onclick="quickReportKill('樹精')">樹精</button>
            <button class="boss-btn-normal" onclick="quickReportKill('巨大鱷魚')">巨大鱷魚</button>
            <button class="boss-btn-normal" onclick="quickReportKill('大腳瑪幽')">大腳瑪幽</button>
            <button class="boss-btn-normal" onclick="quickReportKill('變形怪首領')">變形怪首領</button>
            <button class="boss-btn-normal" onclick="quickReportKill('巨大守護螞蟻')">守護螞蟻</button>
            <button class="boss-btn-normal" onclick="quickReportKill('奈克諾斯')">奈克諾斯</button>
            <button class="boss-btn-normal" onclick="quickReportKill('蜘蛛')">蜘蛛</button>
            <button class="boss-btn-normal" onclick="quickReportKill('力卡溫')">力卡溫</button>

        // Firebase Realtime Database SSE。
        // 任一台手機 / 電腦更新後，其他開啟網站的裝置自動收到。
        function startRealtimeSync() {
            if (firebaseUrl.indexOf("YOUR-PROJECT") !== -1) return;

            try {
                if (realtimeSource) {
                    realtimeSource.close();
                }

                realtimeSource =
                    new EventSource(getFirebaseUrl());

                realtimeSource.addEventListener(
                    'put',
                    function(event) {
                        try {
                            var payload =
                                JSON.parse(event.data);

                            if (!payload) return;

                            if (
                                payload.path === '/' ||
                                payload.path === ''
                            ) {
                                bossSpawnMap =
                                    payload.data || {};
                            } else {
                                var path =
                                    String(payload.path)
                                        .split('/')
                                        .filter(Boolean);

                                if (path.length === 1) {
                                    var bossName = path[0];

                                    if (
                                        payload.data === null
                                    ) {
                                        delete bossSpawnMap[bossName];
                                    } else {
                                        bossSpawnMap[bossName] =
                                            payload.data;
                                    }
                                }
                            }

                            localStorage.setItem(
                                localKey,
                                JSON.stringify(bossSpawnMap)
                            );

                            renderTable();

                        } catch (error) {
                            console.log(
                                'Firebase PUT 解析錯誤：',
                                error
                            );
                        }
                    }
                );

                realtimeSource.addEventListener(
                    'patch',
                    function(event) {
                        try {
                            var payload =
                                JSON.parse(event.data);

                            if (
                                !payload ||
                                !payload.data
                            ) return;

                            var patchData = payload.data;

                            for (var key in patchData) {
                                if (
                                    !Object.prototype
                                        .hasOwnProperty
                                        .call(patchData, key)
                                ) continue;

                                if (patchData[key] === null) {
                                    delete bossSpawnMap[key];
                                } else {
                                    bossSpawnMap[key] =
                                        patchData[key];
                                }
                            }

                            localStorage.setItem(
                                localKey,
                                JSON.stringify(bossSpawnMap)
                            );

                            renderTable();

                        } catch (error) {
                            console.log(
                                'Firebase PATCH 解析錯誤：',
                                error
                            );
                        }
                    }
                );

                realtimeSource.onerror = function() {
                    pullFromCloud();
                };

                console.log(
                    '✅ Firebase 全盟即時同步已啟動'
                );

            } catch (error) {
                console.log(
                    'Firebase 即時同步啟動失敗：',
                    error
                );
            }
        }

            var currentYear = new Date().getFullYear();
            var m = parseInt(val.substring(0, 2), 10) - 1; var d = parseInt(val.substring(2, 4), 10);
            var h = parseInt(val.substring(4, 6), 10); var min = parseInt(val.substring(6, 8), 10);
            
            var maintDate = new Date(currentYear, m, d, h, min, 0);
            if (isNaN(maintDate.getTime())) { alert('時間格式錯誤！'); return; }
            
            var now = new Date(); if (maintDate > now) { alert('設定時間不能比現在晚！'); return; }
            if (!confirm('確認要以開機時間起算並同步全盟嗎？')) return;
            
            var nowMs = now.getTime();
            bossSpawnMap = {}; 
            
            for (var i = 0; i < bossConfig.length; i++) {
                var config = bossConfig[i];
                var cdMs = config.cooldown * 60 * 1000;
                var firstSpawnMs = maintDate.getTime() + cdMs;
                
                var finalTimestamp = firstSpawnMs;
                var passedRounds = 0;
                
                if (nowMs >= firstSpawnMs) {
                    var elapsedMs = nowMs - firstSpawnMs;
                    passedRounds = Math.floor(elapsedMs / cdMs) + 1;
                    finalTimestamp = firstSpawnMs + (passedRounds * cdMs);
                }
                
                bossSpawnMap[config.name] = finalTimestamp + "|" + myID + "|開機時間|" + passedRounds;
            }
            pushToCloud(); inputEl.value = ''; alert('⚙️ 獨立新企業級雲端通道佈署成功！');
        }

        function quickReportKill(bossName) {
            var myID = getValidID(); if(!myID) return;
            var now = new Date();
            var curTimeString = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes() + ':' + (now.getSeconds() < 10 ? '0' : '') + now.getSeconds();

            var cleanInput = userInput.replace(/:/g, '').trim(); 
            if (cleanInput === '') {
                bossSpawnMap[bossName] = "SKIP|" + myID + "||0";
                pushToCloud(); return;
            }
            
            var killH, killM, killS = 0;
            if (cleanInput.length === 4) { killH = parseInt(cleanInput.substring(0, 2), 10); killM = parseInt(cleanInput.substring(2, 4), 10); }
            else if (cleanInput.length === 6) { killH = parseInt(cleanInput.substring(0, 2), 10); killM = parseInt(cleanInput.substring(2, 4), 10); killS = parseInt(cleanInput.substring(4, 6), 10); }

        function renderFixedBosses() {
            var container = document.getElementById('fixed-boss-container');
            if (!container) return;

            container.innerHTML = '';

            var now = new Date();
            var nowMs = now.getTime();
            var fixedRows = [];

            function getNextOccurrence(timeText, noSpawnDays) {
                var startText = timeText.split('-')[0];
                var parts = startText.split(':');

                var candidate = new Date(now);
                candidate.setHours(
                    parseInt(parts[0], 10),
                    parseInt(parts[1], 10),
                    0,
                    0
                );

                // 找到下一個「允許出王」的日期。
                // noSpawnDays：0=週日、6=週六。
                for (var i = 0; i < 8; i++) {
                    var day = candidate.getDay();

                    if (
                        !noSpawnDays ||
                        noSpawnDays.indexOf(day) === -1
                    ) {
                        if (candidate.getTime() > nowMs) {
                            return candidate;
                        }
                    }

                    candidate.setDate(candidate.getDate() + 1);
                    candidate.setHours(
                        parseInt(parts[0], 10),
                        parseInt(parts[1], 10),
                        0,
                        0
                    );
                }

                return candidate;
            }

            function formatCountdown(ms) {
                if (ms <= 0) return '即將開始';

                var totalSeconds = Math.floor(ms / 1000);
                var hours = Math.floor(totalSeconds / 3600);
                var minutes = Math.floor((totalSeconds % 3600) / 60);
                var seconds = totalSeconds % 60;

                return '還有 ' +
                    (hours < 10 ? '0' : '') + hours + ':' +
                    (minutes < 10 ? '0' : '') + minutes + ':' +
                    (seconds < 10 ? '0' : '') + seconds;
            }

            fixedBossConfig.forEach(function(fixed) {
                var occurrences = fixed.times.map(function(timeText) {
                    return {
                        text: timeText,
                        date: getNextOccurrence(
                            timeText,
                            fixed.noSpawnDays || []
                        )
                    };
                });

                occurrences.sort(function(a, b) {
                    return a.date.getTime() - b.date.getTime();
                });

                var next = occurrences[0];
                var countdown = next.date.getTime() - nowMs;

                fixedRows.push({
                    name: fixed.name,
                    times: fixed.times,
                    noSpawnDays: fixed.noSpawnDays || [],
                    next: next,
                    countdown: countdown
                });

            fixedRows.forEach(function(item) {
                var row = document.createElement('div');
                row.className = 'fixed-row';

                var soon = item.countdown <= 30 * 60 * 1000;
                var cls = soon ? ' fixed-soon' : '';

                var cycleText = item.noSpawnDays.indexOf(0) !== -1 &&
                                item.noSpawnDays.indexOf(6) !== -1
                    ? '平日出王｜星期六、星期日不出王'
                    : '每日';

                row.innerHTML =
                    '<div class="fixed-info">' +
                        '<div class="fixed-next' + cls + '">' +
                            item.next.text +
                        '</div>' +
                        '<div class="fixed-name">' +
                            '⏰ ' + item.name +
                        '</div>' +
                        '<div class="fixed-schedule">' +
                            cycleText + '：' +
                            item.times.join('　') +
                        '</div>' +
                    '</div>' +
                    '<div class="fixed-countdown' + cls + '">' +
                        formatCountdown(item.countdown) +
                    '</div>';

                container.appendChild(row);
            });
        }


        // ============================================================
        // 🔊 語音提醒（只新增這一區）
        // 每隻王每一輪：
        // ① 出王前 1 分鐘提醒一次
        // ② 出王時間到提醒一次
        // 語音開關只儲存在「本台裝置」，不影響其他盟友。
        // ============================================================
        var voiceAlertsEnabled =
            localStorage.getItem('lineageVoiceAlerts') === '1';

        // Chrome 重新載入頁面後，語音播放需要新的使用者互動。
        // 只要使用者在頁面上點一下，就重新解鎖語音。
        var voiceSpeechUnlocked = false;

        var voiceAlertState = {};

        function updateVoiceToggleUI() {
            var btn = document.getElementById('voice-toggle-btn');
            var status = document.getElementById('voice-status');

            if (!btn || !status) return;

            if (voiceAlertsEnabled) {
                btn.textContent = 'ON';
                btn.className = 'voice-toggle on';
                status.textContent = '已開啟（點一下頁面啟用語音）';
            } else {
                btn.textContent = 'OFF';
                btn.className = 'voice-toggle off';
                status.textContent = '關閉';
            }
        }

        function toggleVoiceAlerts() {
            if (voiceAlertsEnabled) {
                // 關閉語音
                voiceAlertsEnabled = false;

                localStorage.setItem(
                    'lineageVoiceAlerts',
                    '0'
                );

                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }

                updateVoiceToggleUI();
                return;
            }

            // 開啟語音：
            // 一定要透過使用者點擊來重新啟動，避免 Chrome 在重新整理
            // 或重新開啟頁面後，因自動播放限制而不出聲。
            if (!window.speechSynthesis) {
                alert('此瀏覽器不支援語音提醒。');
                return;
            }

            voiceAlertsEnabled = true;
            voiceSpeechUnlocked = true;

            localStorage.setItem(
                'lineageVoiceAlerts',
                '1'
            );

            var testUtterance =
                new SpeechSynthesisUtterance('語音提醒已開啟');

            testUtterance.lang = 'zh-TW';
            testUtterance.rate = 1.05;
            testUtterance.pitch = 1;

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(testUtterance);

            updateVoiceToggleUI();
        }

        function speakLineageBossAlert(bossName, type) {
            if (
                !voiceAlertsEnabled ||
                !voiceSpeechUnlocked ||
                !window.speechSynthesis
            ) {
                return false;
            }

            var message =
                type === 'before'
                    ? '注意，' + bossName + ' 一分鐘後出王！'
                    : '注意，' + bossName + ' 出王了！';

            try {
                // Chrome 偶爾會讓 speechSynthesis 卡在 paused 狀態。
                window.speechSynthesis.resume();

                var utterance =
                    new SpeechSynthesisUtterance(message);

                utterance.lang = 'zh-TW';
                utterance.rate = 1.05;
                utterance.pitch = 1;

                window.speechSynthesis.speak(utterance);

                return true;
            } catch (e) {
                return false;
            }
        }

        function checkLineageBossVoiceAlerts() {
            if (!voiceAlertsEnabled) return;

            var nowMs = Date.now();

            if (
                typeof bossConfig === 'undefined' ||
                typeof bossSpawnMap === 'undefined'
            ) return;

            bossConfig.forEach(function(config) {

                var dataStr =
                    bossSpawnMap[config.name];

                if (
                    !dataStr ||
                    dataStr.indexOf('|') === -1
                ) return;

                var parts =
                    dataStr.split('|');

                var rawTime = parts[0];

                if (
                    rawTime === 'SKIP' ||
                    !rawTime
                ) return;

                var spawnTimestamp =
                    parseInt(rawTime, 10);

                if (isNaN(spawnTimestamp)) return;

                var cycleKey =
                    config.name + '_' +
                    spawnTimestamp;

                // 出王前 1 分鐘
                if (
                    !voiceAlertState[
                        cycleKey + '_before'
                    ]
                ) {
                    var beforeMs =
                        spawnTimestamp - nowMs;

                    if (
                        beforeMs > 0 &&
                        beforeMs <= 60000
                    ) {
                        if (speakLineageBossAlert(
                            config.displayName ||
                            config.name,
                            'before'
                        )) {
                            voiceAlertState[
                                cycleKey + '_before'
                            ] = true;
                        }
                    }
                }

                // 出王時間到
                if (
                    !voiceAlertState[
                        cycleKey + '_spawn'
                    ]
                ) {
                    var afterMs =
                        nowMs - spawnTimestamp;

                    if (
                        afterMs >= 0 &&
                        afterMs < 60000
                    ) {
                        if (speakLineageBossAlert(
                            config.displayName ||
                            config.name,
                            'spawn'
                        )) {
                            voiceAlertState[
                                cycleKey + '_spawn'
                            ] = true;
                        }
                    }
                }
            });

            // ========================================================
            // ⏰ 固定王語音提醒
            // 每個固定王的每個固定時段：
            // ① 前 1 分鐘提醒一次
            // ② 時間到提醒一次
            // ========================================================
            if (
                typeof fixedBossConfig !== 'undefined' &&
                Array.isArray(fixedBossConfig)
            ) {
                fixedBossConfig.forEach(function(fixed) {

                    fixed.times.forEach(function(timeText) {

                        var startText =
                            timeText.split('-')[0];

                        var timeParts =
                            startText.split(':');

                        var hour =
                            parseInt(timeParts[0], 10);

                        var minute =
                            parseInt(timeParts[1], 10);

                        if (
                            isNaN(hour) ||
                            isNaN(minute)
                        ) return;

                        // 建立今天這個固定王時段的時間
                        var target =
                            new Date();

                        target.setHours(
                            hour,
                            minute,
                            0,
                            0
                        );

                        var todayTargetMs =
                            target.getTime();

                        // ★ 修正固定王「時間到沒語音」的問題
                        // 不可以單純用 target < now 就直接跳到明天，
                        // 因為時間到後的幾十秒內，正是「出王時間到」提醒的有效區間。
                        //
                        // 只有今天的時間已經超過 1 分鐘，
                        // 才代表這一輪真的錯過，改抓明天。
                        if (
                            todayTargetMs < nowMs - 60000
                        ) {
                            target.setDate(
                                target.getDate() + 1
                            );
                        }

                        var targetMs =
                            target.getTime();

                        var cycleKey =
                            'FIXED_' +
                            fixed.name + '_' +
                            timeText + '_' +
                            targetMs;

                        // 前 1 分鐘
                        if (
                            !voiceAlertState[
                                cycleKey + '_before'
                            ]
                        ) {
                            var beforeMs =
                                targetMs - nowMs;

                            if (
                                beforeMs > 0 &&
                                beforeMs <= 60000
                            ) {
                                if (speakLineageBossAlert(
                                    fixed.name,
                                    'before'
                                )) {
                                    voiceAlertState[
                                        cycleKey + '_before'
                                    ] = true;
                                }
                            }
                        }

                        // 時間到
                        if (
                            !voiceAlertState[
                                cycleKey + '_spawn'
                            ]
                        ) {
                            var afterMs =
                                nowMs - targetMs;

                            if (
                                afterMs >= 0 &&
                                afterMs < 60000
                            ) {
                                if (speakLineageBossAlert(
                                    fixed.name,
                                    'spawn'
                                )) {
                                    voiceAlertState[
                                        cycleKey + '_spawn'
                                    ] = true;
                                }
                            }
                        }
                    });
                });
            }

        }

        // 如果使用者之前選擇 ON，Chrome 重新載入後需要新的
        // user gesture；第一次點擊頁面就重新解鎖。
        document.addEventListener('click', function() {
            if (!voiceAlertsEnabled || voiceSpeechUnlocked) return;

            voiceSpeechUnlocked = true;

            if (window.speechSynthesis) {
                window.speechSynthesis.resume();
            }
        }, { once: true });

        // 每秒檢查一次，但只有在語音開關 ON 時才會播放。
        setInterval(
            checkLineageBossVoiceAlerts,
            1000
        );

        // 初始化本機語音開關狀態。
        setTimeout(
            updateVoiceToggleUI,
            0
        );

        function formatBossTime(timeText) {
            if (!timeText || timeText === '--:--:--') {
                return timeText;
            }

            var match = timeText.match(/^(\d{2}:\d{2})(:\d{2})$/);

            if (!match) {
                return timeText;
            }

            return match[1] +
                '<span class="seconds">' +
                match[2] +
                '</span>';
        }

        function renderTable() {
            var pContain = document.getElementById('purple-boss-container'),
                nContain = document.getElementById('normal-boss-container');

            if (!pContain || !nContain) return;

            pContain.innerHTML = '';
            nContain.innerHTML = '';

            var nowMs = new Date().getTime();
            var purpleRows = [];
            var normalRows = [];

            // ------------------------------------------------------------
            // 依照「真正的下一次王時間」排序。
            // 不改原本的倒數 / 自動輪空 / 敵吃 / 廣播 / ID 顯示邏輯。
            // 只有最後顯示時改成「最近的在最上面」。
            // ------------------------------------------------------------
            for (var i = 0; i < bossConfig.length; i++) {

                var config = bossConfig[i];
                var row = document.createElement('div');
                row.className = 'boss-row';

                var timeDisplay = '--:--:--';
                var isFlashing = false;
                var updater = '';
                var note = '';
                var displayRounds = 0;
                var isSkip = false;

                // 用來排序的時間。
                // 沒有有效時間的王會排最後。
                var sortTime = Number.POSITIVE_INFINITY;

                var dataStr = bossSpawnMap[config.name];

                if (dataStr && dataStr.indexOf('|') !== -1) {

                    var parts = dataStr.split('|');
                    var rawTime = parts[0];

                    updater = parts[1] || '';
                    note = parts[2] || '';
                    var manualReason = parts[4] || '';

                    var baseRounds =
                        parseInt(parts[3] || '0', 10);

                    if (rawTime === 'SKIP') {

                        isSkip = true;
                        timeDisplay = '手動輪空';

                        // 手動輪空沒有下一次實際時間，
                        // 排在所有有時間的王後面。
                        sortTime = Number.POSITIVE_INFINITY;

                    } else {

                        var spawnTimestamp =
                            parseInt(rawTime, 10);

                        var cdMs =
                            config.cooldown *
                            60 *
                            1000;

                        displayRounds = baseRounds;

                        if (!isNaN(spawnTimestamp)) {

                            // 🔔 出王前 1 分鐘開始閃爍提醒
                            var beforeSpawnMs =
                                spawnTimestamp - nowMs;

                            if (
                                beforeSpawnMs > 0 &&
                                beforeSpawnMs <= 60 * 1000
                            ) {
                                isFlashing = true;
                            }

                            if (nowMs >= spawnTimestamp) {

                                var overMs =
                                    nowMs -
                                    spawnTimestamp;

                                // Boss 出現後保留 10 分鐘觀察 / 擊殺時間。
                                // 超過這 10 分鐘，就自動輪空到下一輪。
                                var graceMs =
                                    10 * 60 * 1000;

                                if (overMs <= graceMs) {

                                    // 還在 10 分鐘寬限時間內
                                    isFlashing = true;

                                } else {

                                    // ★ 修正原本 10~11 分鐘之間的 BUG
                                    //
                                    // 原本：
                                    // floor((overMin - 11) / cooldown) + 1
                                    //
                                    // 在 10:00 ~ 11:00 之間可能算出 0 輪，
                                    // 導致畫面一直停在原本時間。
                                    //
                                    // 現在改成：
                                    // 超過寬限時間後，直接計算應該輪空幾輪。
                                    var dynamicRounds =
                                        Math.ceil(
                                            (overMs - graceMs) /
                                            cdMs
                                        );

                                    if (dynamicRounds < 1) {
                                        dynamicRounds = 1;
                                    }

                                    spawnTimestamp =
                                        spawnTimestamp +
                                        (dynamicRounds * cdMs);

                                    displayRounds +=
                                        dynamicRounds;
                                }
                            }

                            // ★ 這個時間就是「下一次要打的時間」
                            // 直接拿它排序，不再只比較 HH:MM:SS。
                            sortTime = spawnTimestamp;

                            var dObj =
                                new Date(
                                    spawnTimestamp
                                );

                            var hStr =
                                (dObj.getHours() < 10
                                    ? '0'
                                    : '') +
                                dObj.getHours();

                            var mStr =
                                (dObj.getMinutes() < 10
                                    ? '0'
                                    : '') +
                                dObj.getMinutes();

                            var sStr =
                                (dObj.getSeconds() < 10
                                    ? '0'
                                    : '') +
                                dObj.getSeconds();

                            timeDisplay =
                                hStr + ':' +
                                mStr + ':' +
                                sStr;
                        }
                    }
                }

                var tagClass =
                    config.isPurple
                        ? 'tag-purple'
                        : 'tag-normal';

                var tagText =
                    config.isPurple
                        ? '紫'
                        : '一般';

                var noteHtml = '';

                if (note === '敵吃') {
                    noteHtml =
                        '<span class="note-tag note-enemy">敵吃</span>';
                } else if (note === '廣播') {
                    noteHtml =
                        '<span class="note-tag note-broadcast">廣播</span>';
                } else if (note === '開機時間') {
                    noteHtml =
                        '<span class="note-tag note-maint">開機時間</span>';
                } else if (note) {
                    // 不是 1/2/3 的文字，就直接當作手動輸入原因顯示。
                    noteHtml =
                        '<span class="note-tag note-manual">📝 ' +
                        note.replace(/</g, '&lt;').replace(/>/g, '&gt;') +
                        '</span>';
                }

                if (displayRounds > 0) {
                    noteHtml +=
                        '<span class="note-tag note-autoskip">自動輪空 ' +
                        displayRounds +
                        ' 輪</span>';
                }

                var userHtml = '';

                if (updater) {
                    userHtml =
                        '<span class="user-tag">✍️ ' +
                        updater +
                        '</span>';
                }

                var timeColor = '#fff';

                if (displayRounds > 0 || isSkip) {
                    timeColor = '#ff4444';
                } else if (config.isPurple && dataStr) {
                    timeColor = 'var(--purple-theme)';
                }

                var flashClassStr =
                    isFlashing
                        ? ' class="boss-time time-flash"'
                        : ' class="boss-time"';

                row.innerHTML =
                    '<div class="boss-info">' +
                        '<div style="color:' +
                            timeColor +
                            '"' +
                            flashClassStr +
                        '>' +
                            formatBossTime(timeDisplay) +
                        '</div>' +

                        '<div class="boss-name">' +
                            '<span class="status-tag ' +
                                tagClass +
                            '">' +
                                tagText +
                            '</span>' +

                            '<strong>' +
                                (
                                    config.displayName ||
                                    config.name
                                ) +
                            '</strong>' +

                            noteHtml +
                            userHtml +
                        '</div>' +
                    '</div>' +

                    '<div class="boss-actions">' +
                        '<button class="btn-del" onclick="deleteSingleBoss(\'' +
                            config.name +
                        '\')">🗑️</button>' +
                    '</div>';

                var item = {
                    row: row,
                    sortTime: sortTime,
                    originalIndex: i
                };

                if (config.isPurple) {
                    purpleRows.push(item);
                } else {
                    normalRows.push(item);
                }
            }

            // 最近的時間排最上面。
            // 沒有登記時間 / 手動輪空的王排最後。
            function sortRows(a, b) {

                if (a.sortTime === b.sortTime) {
                    return a.originalIndex -
                           b.originalIndex;
                }

                if (
                    a.sortTime ===
                    Number.POSITIVE_INFINITY
                ) {
                    return 1;
                }

                if (
                    b.sortTime ===
                    Number.POSITIVE_INFINITY
                ) {
                    return -1;
                }

                return a.sortTime -
                       b.sortTime;
            }

            purpleRows.sort(sortRows);
            normalRows.sort(sortRows);

            // 紫王、一般王維持完全分開。
            for (var p = 0; p < purpleRows.length; p++) {
                pContain.appendChild(
                    purpleRows[p].row
                );
            }

            for (var n = 0; n < normalRows.length; n++) {
                nContain.appendChild(
                    normalRows[n].row
                );
            }
        }

        window.onload = startAllianceGate;
    </script>
</body>
